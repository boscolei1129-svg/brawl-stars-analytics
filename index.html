        : '<div class="sub">This browser can\'t show notifications from web apps. On iPhone or iPad, open the app from your Home Screen.</div>';
    } else if (locked) {
      inner = '<div class="sub">Unlock goal editing above to turn on notifications for this device.</div>';
    } else if (!P.endpoint) {
      inner = '<div class="sub">Get an alert when you reach a goal, pass a trophy milestone (every 500 for you, every 5,000 for the club), when members join or leave, and a recap of your day at 10 PM.</div>' +
        '<div class="row mt"><button class="btn" data-push="on"' + (P.busy ? " disabled" : "") + ">" + (P.busy ? "Turning on…" : "Turn on notifications") + "</button></div>";
    } else {
      inner = '<div class="list">' + PUSH_KINDS.map(([k, label]) =>
          '<div class="li"><div class="main"><div class="t1">' + label + '</div></div><button class="toggle" role="switch" data-pref="' + k + '" aria-checked="' + (P.prefs[k] !== false) + '" aria-label="' + label + '"' + (P.busy ? " disabled" : "") + "><i></i></button></div>").join("") + "</div>" +
        '<div class="row mt" style="justify-content:space-between"><button class="btn ghost" data-push="test"' + (P.busy ? " disabled" : "") + '>Send a test</button><button class="link" data-push="off"' + (P.busy ? " disabled" : "") + ">Turn off on this device</button></div>";
    }
    return '<div class="card" id="pushCard"><h2>Notifications<span class="sp"></span>' + (P.endpoint ? '<span class="aside up-t">On</span>' : "") + "</h2>" + inner +
      (P.msg ? '<div class="sub mt" role="status">' + esc(P.msg) + "</div>" : "") + "</div>";
  }
  const b64urlBytes = (s) => { const b = atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)); return Uint8Array.from(b, (c) => c.charCodeAt(0)); };
  async function pushInit() {
    const P = S.push;
    P.supported = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
    P.ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    P.standalone = !!((window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true);
    try { Object.assign(P.prefs, JSON.parse(localStorage.getItem("pushPrefs") || "{}")); } catch (e) {}
    if (!P.supported) return;
    P.permission = Notification.permission;
    try { const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription(); P.endpoint = sub ? sub.endpoint : null; } catch (e) {}
    render();
  }
  async function pushOn() {
    const P = S.push;
    if (P.busy) return;
    P.busy = true; P.msg = ""; render();
    try {
      // iPhone only allows this right after a tap, so it comes first.
      const perm = await Notification.requestPermission();
      P.permission = perm;
      if (perm !== "granted") { P.msg = perm === "denied" ? "Notifications are blocked for this app. Turn them on in Settings › Notifications › Brawl Stats, then try again." : "Notifications weren't allowed."; return; }
      const { key } = await callFn({ action: "push_key" });
      const reg = await navigator.serviceWorker.ready;
      const sub = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64urlBytes(key) }));
      await callFn({ action: "push_subscribe", code: S.ownerCode, sub: sub.toJSON(), prefs: P.prefs });
      P.endpoint = sub.endpoint;
      P.msg = "Notifications are on for this device. Send a test to check.";
    } catch (e) {
      P.msg = e && e.code === "wrong_code" ? "That owner code no longer works. Unlock again first." : "Couldn't turn on notifications: " + String((e && e.message) || e).slice(0, 120);
    } finally { P.busy = false; render(); }
  }
  async function pushOff() {
    const P = S.push;
    if (P.busy) return;
    P.busy = true; P.msg = ""; render();
    try {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if (sub) { await callFn({ action: "push_unsubscribe", endpoint: sub.endpoint }).catch(() => {}); await sub.unsubscribe(); }
      P.endpoint = null; P.msg = "Notifications are off for this device.";
    } catch (e) { P.msg = "Couldn't turn notifications off: " + String((e && e.message) || e).slice(0, 120); }
    finally { P.busy = false; render(); }
  }
  async function pushTest() {
    const P = S.push;
    if (P.busy || !P.endpoint) return;
    P.busy = true; P.msg = ""; render();
    try { await callFn({ action: "push_test", code: S.ownerCode, endpoint: P.endpoint }); P.msg = "Test sent. It should arrive in a few seconds."; }
    catch (e) { P.msg = e && e.code === "not_subscribed" ? "This device isn't registered any more. Turn notifications off and on again." : "The test didn't go through: " + String((e && e.message) || e).slice(0, 120); }
    finally { P.busy = false; render(); }
  }
  async function pushPref(k) {
    const P = S.push;
    P.prefs[k] = P.prefs[k] === false;
    try { localStorage.setItem("pushPrefs", JSON.stringify(P.prefs)); } catch (e) {}
    render();
    if (P.endpoint && S.ownerCode) {
      try { await callFn({ action: "push_prefs", code: S.ownerCode, endpoint: P.endpoint, prefs: P.prefs }); }
      catch (e) { P.prefs[k] = !P.prefs[k]; P.msg = "Couldn't save that setting. Try again."; render(); }
    }
  }

  // ---------- render ----------
  const RENDER = { me: renderMe, club: renderClub, activity: renderActivity, brawlers: renderBrawlers, goals: renderGoals };
  function render() {
    if (!S.loaded) return;
    derive();
    $("#skel").hidden = true;
    const P = D.P, C = D.C;
    if (P) $("#hName").textContent = P.p.name || "bboscox";
    const av = $("#hAvatar"), iconId = P && P.p.icon;
    if (av && iconId && av.dataset.icon !== String(iconId)) { av.innerHTML = art(ART.icon(iconId)) + esc(initials(P.p.name || "B")); av.dataset.icon = iconId; av.hidden = false; }
    $("#hSub").textContent = "Player // #" + ME;
    const btn = $("#refreshBtn");
    btn.classList.toggle("busy", S.live.busy);
    btn.classList.toggle("stale", !S.live.busy && (!D.lastTs || Date.now() - D.lastTs > 2 * HOUR));
    $("#syncTxt").textContent = S.live.busy ? "Syncing" : D.lastTs ? "Synced " + agoShort(D.lastTs) : "No data";
    const rb = $("#rangeBar");
    rb.hidden = S.tab !== "me";
    if (S.tab === "me") rb.innerHTML = ["24h", "7d", "30d", "all"].map((k) => '<button data-seg="me" data-v="' + k + '" aria-pressed="' + (S.r.me === k) + '">' + RANGE_LABEL[k] + "</button>").join("");
    document.documentElement.style.setProperty("--hdr-h", ($(".top").offsetHeight || 120) + "px");
    for (const sec of document.querySelectorAll("section[data-tab]")) sec.hidden = sec.dataset.tab !== S.tab;
    const sec = $('section[data-tab="' + S.tab + '"]');
    const active = document.activeElement && document.activeElement.id;
    const caret = active === "brSearch" ? document.activeElement.selectionStart : null;
    charts.length = 0;
    sec.innerHTML = RENDER[S.tab]();
    layoutColumns(sec, S.tab);
    // Motion: panels rise in when you switch tabs; charts draw in when the tab, range or chart type changes.
    const still = REDUCED();
    const sig = [S.tab, S.r.me, S.r.club, S.chartMode, S.actDay].join("|");
    S.drawAnim = !still && sig !== render.sig;
    render.sig = sig;
    if (!still && S.tab !== render.tab) enterItems(sec);
    render.tab = S.tab;
    flushCharts();
    S.drawAnim = false;
    countUps(sec);
    if (render.warmVer !== S.ver) { render.warmVer = S.ver; setTimeout(warmArt, 1500); }
    for (const b of document.querySelectorAll(".tabbar button")) { if (b.dataset.go === S.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); }
    if (active === "brSearch") { const el = $("#brSearch"); if (el) { el.focus(); try { el.setSelectionRange(caret, caret); } catch (e) {} } }
  }

  // ---------- banner ----------
  function showBanner(html, action) {
    $("#banner").innerHTML = html ? '<div class="banner"><div>' + html + "</div>" + (action ? '<button class="btn ghost" data-act="' + action.act + '">' + esc(action.label) + "</button>" : "") + "</div>" : "";
  }

  // ---------- live refresh ----------
  async function refreshLive() {
    if (S.live.busy) return;
    S.live.busy = true; render();
    try {
      const res = await callFn({ action: "refresh", src: "live" });
      await loadData(false);
      showBanner(res.player_error ? "<b>Your player stats didn't update this time.</b> " + esc(String(res.player_error).slice(0, 140)) : "", res.player_error ? { act: "retry", label: "Retry" } : null);
    } catch (e) {
      try { await loadData(!S.readings.length); } catch (e2) {}
      showBanner(navigator.onLine === false
        ? "<b>You're offline.</b> Showing your last saved stats."
        : "<b>Couldn't refresh just now.</b> " + esc(String((e && e.message) || e).slice(0, 140)), { act: "retry", label: "Retry" });
    } finally {
      S.live.busy = false; S.live.at = Date.now(); render();
    }
  }

  // ---------- events ----------
  document.addEventListener("click", (ev) => {
    const t = ev.target.closest("button");
    if (!t) return;
    if (t.dataset.go) { S.tab = t.dataset.go; try { localStorage.setItem("tab", S.tab); } catch (e) {} render(); window.scrollTo({ top: 0 }); return; }
    if (t.dataset.seg) {
      const g = t.dataset.seg, v = t.dataset.v;
      if (g in S.r) S.r[g] = v; else if (g === "bType") S.bType = v; else if (g === "brSort") S.brSort = v; else if (g === "memSort") S.memSort = v; else if (g === "chart") S.chartMode = v; else if (g === "actDay") { S.actDay = +v; S.actOpen = null; }
      if (g === "me" || g === "chart") { try { localStorage.setItem("prefs", JSON.stringify({ range: S.r.me, chart: S.chartMode })); } catch (e) {} }
      render(); return;
    }
    if (t.dataset.toggle) { S.open[t.dataset.toggle] = !S.open[t.dataset.toggle]; render(); return; }
    if (t.dataset.jump) {
      const el = document.getElementById(t.dataset.jump) || document.getElementById("sec-battles");
      const still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (el) el.scrollIntoView({ behavior: still ? "auto" : "smooth", block: "start" });
      return;
    }
    if (t.dataset.actM) { S.actOpen = S.actOpen === t.dataset.actM ? null : t.dataset.actM; render(); return; }
    if (t.dataset.br) { S.openBrawler = S.openBrawler === t.dataset.br ? null : t.dataset.br; render(); return; }
    if (t.id === "refreshBtn" || t.dataset.act === "retry" || t.dataset.act === "allow") { refreshLive(); return; }
    if (t.dataset.act === "maps") { S.showAllMaps = !S.showAllMaps; render(); return; }
    if (t.dataset.act === "log") { S.showAllLog = !S.showAllLog; render(); return; }
    if (t.dataset.quick) { const [kind, target] = t.dataset.quick.split(":"); addGoal({ kind, target: +target }); return; }
    if (t.dataset.delAsk) { S.confirmDel = t.dataset.delAsk; render(); return; }
    if (t.dataset.delCancel) { S.confirmDel = null; render(); return; }
    if (t.dataset.del) { const id = t.dataset.del; S.confirmDel = null; goalCall({ action: "goal_delete", id }); return; }
    if (t.dataset.push) { if (t.dataset.push === "on") pushOn(); else if (t.dataset.push === "off") pushOff(); else pushTest(); return; }
    if (t.dataset.pref) { pushPref(t.dataset.pref); return; }
    if (t.dataset.act === "lock") { S.ownerCode = null; try { localStorage.removeItem("ownerCode"); } catch (e) {} render(); return; }
  });
  document.addEventListener("input", (ev) => {
    if (ev.target.id === "brSearch") { S.brQuery = ev.target.value; render(); }
  });
  document.addEventListener("change", (ev) => {
    if (ev.target.id === "gKind") { S.goalKind = ev.target.value; const w = $("#gBrWrap"); if (w) w.hidden = S.goalKind !== "brawler"; }
  });
  document.addEventListener("submit", (ev) => {
    if (ev.target.id === "codeForm") { ev.preventDefault(); unlock($("#ownerCode").value); return; }
    if (ev.target.id !== "goalForm") return;
    ev.preventDefault();
    const target = Math.round(+$("#gTarget").value);
    const msg = $("#gMsg");
    if (!target || target < 1) { msg.textContent = "Enter a target number."; return; }
    const g = { kind: S.goalKind, target };
    if (g.kind === "brawler") g.brawler = $("#gBrawler").value;
    addGoal(g);
  });
  async function reloadGoals() {
    S.goals = (await rest("goals?select=*&order=created_at.asc")).map(mapGoal);
    cacheSet();
  }
  async function goalCall(body) {
    if (!S.ownerCode || S.goalBusy) return;
    S.goalBusy = true;
    if (body.action === "goal_delete") S.goals = S.goals.filter((g) => g.id !== body.id);
    render();
    try {
      await callFn(Object.assign({ code: S.ownerCode }, body));
      await reloadGoals();
      showBanner("");
    } catch (e) {
      try { await reloadGoals(); } catch (e2) {}
      if (e.code === "wrong_code") {
        S.ownerCode = null;
        try { localStorage.removeItem("ownerCode"); } catch (x) {}
        showBanner("<b>That owner code no longer works.</b> Enter it again on the Goals tab.");
      } else {
        showBanner("<b>Couldn't save that change.</b> " + esc(String((e && e.message) || e).slice(0, 140)));
      }
    } finally {
      S.goalBusy = false; render();
    }
  }
  function addGoal(g) { return goalCall({ action: "goal_add", kind: g.kind, target: g.target, brawler: g.brawler }); }
  async function unlock(raw) {
    const msg = $("#codeMsg"), code = String(raw || "").trim();
    if (!code) { if (msg) msg.textContent = "Enter your owner code."; return; }
    if (msg) msg.textContent = "Checking…";
    try {
      const r = await callFn({ action: "check_code", code });
      if (r.ok) {
        S.ownerCode = code;
        try { localStorage.setItem("ownerCode", code); } catch (e) {}
        render();
      } else if (msg) msg.textContent = "That code isn't right. Check it and try again.";
    } catch (e) {
      if (msg) msg.textContent = "Couldn't check the code right now. Try again in a moment.";
    }
  }
  let rT = null;
  window.addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(render, 150); });

  // ---------- boot ----------
  try { const t = localStorage.getItem("tab"); if (t && RENDER[t]) S.tab = t; } catch (e) {}
  try {
    const pr = JSON.parse(localStorage.getItem("prefs") || "{}");
    if (pr && RANGES[pr.range]) S.r.me = pr.range;
    if (pr && (pr.chart === "time" || pr.chart === "battle")) S.chartMode = pr.chart;
  } catch (e) {}
  const h = (location.hash || "").slice(1); if (RENDER[h]) S.tab = h; else if (h === "battles") S.tab = "me";
  window.addEventListener("hashchange", () => { const t = (location.hash || "").slice(1); if (RENDER[t] && t !== S.tab) { S.tab = t; render(); window.scrollTo({ top: 0 }); } });

  async function boot() {
    try { S.ownerCode = localStorage.getItem("ownerCode") || null; } catch (e) {}
    const cached = await cacheGet();
    if (cached && cached.v === CACHE_V && Array.isArray(cached.readings) && cached.readings.length) {
      S.readings = cached.readings; S.battleRows = cached.battleRows || []; S.goals = cached.goals || []; S.sessions = cached.sessions || [];
      S.ver++; S.loaded = true; render();
    }
    try { await loadData(!S.readings.length); }
    catch (e) {
      showBanner(S.readings.length
        ? "<b>Couldn't reach the server.</b> Showing the stats saved on this device."
        : "<b>Couldn't load your stats.</b> " + esc(String((e && e.message) || e).slice(0, 140)), { act: "retry", label: "Retry" });
    }
    S.loaded = true;
    render();
    const due = () => document.visibilityState === "visible" && !S.live.busy && Date.now() - Math.max(S.live.at, D ? D.lastTs : 0) > 3 * 60e3; // while the app is open, check every few minutes
    if (due()) refreshLive();
    setInterval(() => { if (due()) refreshLive(); }, 60e3);
    document.addEventListener("visibilitychange", () => { if (due()) refreshLive(); });
    setInterval(() => { if (document.visibilityState === "visible") render(); }, 60e3);
    // Keeps the page, fonts and icons on this device so the app opens instantly (see sw.js).
    if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
    pushInit();
  }
  boot();
})();
</script>
