<style>
/* Layout: esports HUD. One phone-width column of hard-edged panels, sticky status bar, text tab bar with an orange rail. */
:root {
  color-scheme: dark;
  --bg: #0c0e11;
  --surface: #14171c;
  --raise: #1b1f26;
  --line: #2a2f38;
  --line-2: #22272f;
  --fg: #e8ebf0;
  --fg-2: #b4bcc9;
  --muted: #8a93a3;
  --accent: #ff7a1a;
  --accent-soft: rgba(255, 122, 26, 0.14);
  --teal: #27d3c3;
  --teal-soft: rgba(39, 211, 195, 0.13);
  --bad: #ff6b6b;
  --bad-soft: rgba(255, 107, 107, 0.13);
  --font-ui: "Chakra Petch", "Avenir Next Condensed", "Segoe UI", system-ui, sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --tabbar-h: 58px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
html, body { background: var(--bg); color: var(--fg); }
body {
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 24px);
  min-height: 100%;
}
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.k-label { font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }

/* Status bar */
.top {
  position: sticky; top: 0; z-index: 5;
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
  padding-bottom: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));

}
.top-row { display: flex; align-items: center; gap: 12px; min-width: 0; }
.rangebar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); }
.rangebar button {
  border: 0; border-right: 1px solid var(--line); background: none; color: var(--muted);
  font-size: 11.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 9px 0; min-height: 38px;
}

[id^="sec-"] { scroll-margin-top: calc(var(--hdr-h, 120px) + 12px); }
.card.coll { padding: 0; }

.coll-t { flex: 1; min-width: 0; display: grid; gap: 3px; }

.who { min-width: 0; flex: 1; display: grid; gap: 1px; }

.sync {

/* Banner */

.asof i { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); flex: none; margin-top: 5px; }
.asof.lag i { background: var(--accent); }
.asof b { font-family: var(--font-num); font-weight: 500; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--fg); display: block; }

.mt { margin-top: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; font-family: var(--font-num); font-size: 11.5px; font-weight: 500;
  border: 1px solid var(--line); color: var(--fg-2); white-space: nowrap; text-transform: uppercase;
}
.chip.up { color: var(--teal); border-color: rgba(39, 211, 195, 0.4); background: var(--teal-soft); }
.chip.down { color: var(--bad); border-color: rgba(255, 107, 107, 0.4); background: var(--bad-soft); }
.chip.hot { color: var(--accent); border-color: rgba(255, 122, 26, 0.45); background: var(--accent-soft); }

/* Stat strip */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); }
.tiles.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tile { padding: 10px 12px; min-width: 0; border-right: 1px solid var(--line); display: grid; gap: 2px; align-content: start; }
.tile:last-child { border-right: 0; }
.tile .k { font-size: 10.5px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v { font-family: var(--font-num); font-weight: 700; font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v.up { color: var(--teal); }
.tile .v.down { color: var(--bad); }
.tile .n { font-family: var(--font-num); font-size: 10.5px; color: var(--fg-2); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Segmented control */
.seg { display: inline-flex; border: 1px solid var(--line); max-width: 100%; overflow-x: auto; }
.seg button {
  border: 0; border-right: 1px solid var(--line); background: none; color: var(--muted);
  font-size: 11.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 8px 11px; white-space: nowrap;
}
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.ctrls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 10px; }

/* Charts */
.chart { position: relative; min-height: 170px; touch-action: pan-y; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .grid { stroke: var(--line-2); stroke-width: 1; }
.chart .ax { fill: var(--muted); font-size: 10.5px; font-family: var(--font-num); }
.chart .xh { stroke: var(--fg-2); stroke-width: 1; opacity: 0.45; }
.chart .ring { stroke: var(--surface); stroke-width: 2; }
.chart-empty { display: grid; place-items: center; min-height: 140px; color: var(--muted); font-size: 13.5px; text-align: center; padding: 0 12px; }
.tip {
  position: absolute; top: 0; pointer-events: none; z-index: 2; background: var(--raise); border: 1px solid var(--line);
  padding: 6px 9px; font-family: var(--font-num); font-size: 11.5px; color: var(--fg-2); white-space: nowrap; transform: translateX(-50%);
}
.tip b { color: var(--fg); font-size: 13px; }

/* Lists */
.list { display: grid; }
.li { display: flex; align-items: center; gap: 12px; padding: 10px 0; min-width: 0; border-top: 1px solid var(--line-2); }
.list > .li:first-child, .list > .lib:first-child > .li { border-top: 0; }
.li .main { flex: 1; min-width: 0; }

.li .end { text-align: right; flex: none; font-family: var(--font-num); }
.li .end .big { font-weight: 700; font-size: 14.5px; }

.mono {
  width: 38px; height: 38px; flex: none; display: grid; place-items: center; position: relative;

}
.mono.p11 { border-color: rgba(255, 122, 26, 0.6); }
.pow { position: absolute; right: -6px; bottom: -6px; font-family: var(--font-num); font-size: 9px; font-weight: 700; padding: 0 3px; background: var(--bg); border: 1px solid var(--line); color: var(--fg-2); }
.mono.p11 .pow { color: var(--accent); border-color: rgba(255, 122, 26, 0.6); }
.res { width: 46px; flex: none; font-family: var(--font-num); font-weight: 700; font-size: 12.5px; }
.res.w { color: var(--teal); }
.res.l { color: var(--bad); }
.res.d { color: var(--muted); }
.res.first { color: var(--accent); }
.you { color: var(--accent); font-size: 10.5px; font-weight: 700; letter-spacing: 1px; margin-left: 6px; }
.role { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 1px 5px; margin-left: 6px; vertical-align: 1px; border: 1px solid var(--line); color: var(--fg-2); }
.role.president { color: var(--accent); border-color: rgba(255, 122, 26, 0.5); }
.role.vicePresident { color: var(--teal); border-color: rgba(39, 211, 195, 0.45); }
.lib > .li { width: 100%; background: none; color: inherit; font: inherit; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; padding-left: 0; padding-right: 0; }
.detail { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 2px 0 12px 50px; }
.detail div { font-size: 10.5px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
.detail b { display: block; color: var(--fg); font-family: var(--font-num); font-size: 14px; letter-spacing: 0; text-transform: none; }

/* Meters */
.meter { height: 4px; background: var(--line-2); margin-top: 7px; }
.meter i { display: block; height: 100%; background: var(--fg-2); }
.meter.hot i { background: var(--accent); }
.meter.teal i { background: var(--teal); }
.wl { display: flex; gap: 2px; height: 8px; margin: 12px 0 8px; }
.wl i { display: block; height: 100%; }
.wl .w { background: var(--teal); }
.wl .l { background: var(--bad); }
.wl .d { background: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-family: var(--font-num); font-size: 12px; color: var(--fg-2); text-transform: uppercase; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

.wr { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }

.log { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line-2); }

.log .nm { font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.field { display: grid; gap: 6px; min-width: 0; }

}

.search { flex: 1; min-width: 150px; }

.skel { display: grid; gap: 12px; padding: 2px 0; }
.sk { border: 1px solid var(--line); background: linear-gradient(90deg, var(--surface) 0%, var(--raise) 50%, var(--surface) 100%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }

/* Tab bar */
.tabbar {

  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);

  padding-left: max(8px, env(safe-area-inset-left, 0px));

.sec-label { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 11px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: var(--accent); }

.tabbar button {

/* Tablet and wider: two columns of panels (built by layoutColumns in the script). */
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.col { display: grid; gap: 12px; min-width: 0; }
.col.stick { position: sticky; top: calc(var(--hdr-h, 120px) + 14px); }
@media (min-width: 768px) {
  .wrap { max-width: 1180px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }

    margin-left: calc(-1 * max(24px, env(safe-area-inset-left, 0px)));

/* Game art: pictures sit on top of the initials, which show if a picture can't load. */
.mono { overflow: visible; }

.mono.sm { width: 34px; height: 34px; font-size: 11px; }
.mono.ico .art { object-fit: contain; padding: 4px; }
.mono.av { width: 42px; height: 42px; }
.log { grid-template-columns: 40px 34px minmax(0, 1fr) auto; }
.res { width: auto; }
.rankrow { display: flex; align-items: center; gap: 14px; }
.rankart { width: 58px; height: 58px; object-fit: contain; flex: none; }

/* Switch (notification settings) */
.toggle { flex: none; width: 46px; height: 28px; border-radius: 14px; border: 1px solid var(--line); background: var(--raise); position: relative; padding: 0; }
.toggle i { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--muted); transition: transform 0.18s ease, background-color 0.18s ease; }
.toggle[aria-checked="true"] { background: rgba(39, 211, 195, 0.18); border-color: rgba(39, 211, 195, 0.6); }
.toggle[aria-checked="true"] i { transform: translateX(18px); background: var(--teal); }

/* Activity */
.act-now .big-row { display: flex; align-items: baseline; gap: 10px; }
.act-now .of { font-family: var(--font-num); color: var(--muted); font-size: 14px; }
.pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--teal); display: inline-block; box-shadow: 0 0 0 0 rgba(39, 211, 195, 0.6); animation: ping 1.8s ease-out infinite; flex: none; }
.pulse.off { background: var(--muted); animation: none; box-shadow: none; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(39, 211, 195, 0.55); } 80%, 100% { box-shadow: 0 0 0 10px rgba(39, 211, 195, 0); } }
.who-on { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.who-on .p { display: inline-flex; align-items: center; gap: 8px; border: 1px solid rgba(39, 211, 195, 0.35); background: rgba(39, 211, 195, 0.07); padding: 4px 10px 4px 4px; font-size: 13px; font-weight: 600; }
.who-on .p .mono { width: 26px; height: 26px; font-size: 10px; }
.who-on .p .ago { font-family: var(--font-num); font-size: 11px; color: var(--teal); font-weight: 500; }
.axis { position: relative; height: 16px; margin: 4px 0 2px; font-family: var(--font-num); font-size: 10px; color: var(--muted); }
.axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.axis span:first-child { transform: none; } .axis span:last-child { transform: translateX(-100%); }
.arow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; grid-template-areas: "av nm tot" "tr tr tr"; align-items: center; column-gap: 10px; row-gap: 7px;
  width: 100%; padding: 11px 0; background: none; border: 0; border-top: 1px solid var(--line-2); color: inherit; font: inherit; text-align: left; }
.arow:first-child { border-top: 0; }
.arow > .mono { grid-area: av; }
.arow .nm { grid-area: nm; min-width: 0; font-weight: 600; font-size: 14.5px; display: flex; align-items: center; gap: 7px; overflow: hidden; white-space: nowrap; }
.arow .nm b { overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.arow .tot { grid-area: tot; font-family: var(--font-num); font-size: 12px; color: var(--fg-2); text-align: right; }
.arow .tot small { display: block; color: var(--muted); font-size: 10.5px; }
.track { grid-area: tr; position: relative; height: 14px; background-color: var(--raise); border: 1px solid var(--line-2);
  background-image: repeating-linear-gradient(90deg, transparent 0, transparent calc(12.5% - 1px), var(--line-2) calc(12.5% - 1px), var(--line-2) 12.5%); }
.track .blk { position: absolute; top: 2px; bottom: 2px; min-width: 3px; background: linear-gradient(180deg, #3fe6d6, #1fb3a5); border-radius: 1px; }
.track .blk.live { background: linear-gradient(180deg, #7ff5ea, #27d3c3); box-shadow: 0 0 10px rgba(39, 211, 195, 0.75); }
.track .now { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--accent); box-shadow: 0 0 6px rgba(255, 122, 26, 0.7); }
.track.grow .blk { transform-origin: left center; animation: growx 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
@keyframes growx { from { transform: scaleX(0); opacity: 0.2; } to { transform: none; opacity: 1; } }
.adetail { padding: 2px 0 14px 44px; display: grid; gap: 10px; }
.adetail .sess { display: grid; gap: 6px; }
.adetail .sess div { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
.adetail .sess span:last-child { font-family: var(--font-num); color: var(--fg-2); font-size: 12px; text-align: right; }
.strip { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 2px; }
.strip i, .heat i { display: block; aspect-ratio: 1 / 1; background: rgba(39, 211, 195, var(--a, 0)); border: 1px solid var(--line-2); }
.heat { display: grid; grid-template-columns: 30px repeat(24, minmax(0, 1fr)); gap: 2px; align-items: center; }
.heat b { font-family: var(--font-num); font-size: 10px; color: var(--muted); font-weight: 500; }
.heat i.peak { border-color: var(--teal); box-shadow: 0 0 8px rgba(39, 211, 195, 0.6); }
.heat-x { display: grid; grid-template-columns: 30px repeat(4, minmax(0, 1fr)); font-family: var(--font-num); font-size: 10px; color: var(--muted); margin-top: 4px; }
.legend-ramp { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
.legend-ramp i { width: 60px; height: 8px; background: linear-gradient(90deg, rgba(39, 211, 195, 0.05), rgba(39, 211, 195, 1)); border: 1px solid var(--line-2); }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); margin-bottom: 12px; }
.days button { border: 0; border-right: 1px solid var(--line); background: none; color: var(--muted); padding: 7px 0 6px; display: grid; justify-items: center; gap: 2px; }
.days button:last-child { border-right: 0; }
.days button span { font-size: 9.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
.days button b { font-family: var(--font-num); font-size: 15px; font-weight: 600; color: var(--fg-2); }
.days button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
.days button[aria-pressed="true"] b { color: var(--accent); }
.barrow { display: grid; grid-template-columns: 34px minmax(0, 1fr) 76px; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line-2); }
.barrow:first-child { border-top: 0; }
.barrow .bar { height: 6px; background: var(--raise); margin-top: 6px; }
.barrow .bar i { display: block; height: 100%; background: linear-gradient(90deg, #1fb3a5, #3fe6d6); }
.barrow .nm { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.barrow .end { font-family: var(--font-num); font-size: 12.5px; text-align: right; }
.barrow .end small { display: block; color: var(--muted); font-size: 10.5px; }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } .track.grow .blk { animation: none; } }

/* Notification settings */
.li.pref { align-items: flex-start; padding: 13px 0; }
.li.pref .toggle { margin-top: 1px; }
.li .t2.desc { white-space: normal; overflow: visible; line-height: 1.45; margin-top: 3px; font-size: 12.5px; }
.when { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.when .lbl { font-size: 10.5px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
.when .next { font-size: 12px; color: var(--muted); }
.timepick {
  -webkit-appearance: none; appearance: none; font-family: var(--font-num); font-size: 15px; font-weight: 700; color: var(--teal);
  background: rgba(39, 211, 195, 0.07); border: 1px solid rgba(39, 211, 195, 0.45); border-radius: 0; padding: 7px 10px; min-width: 116px; min-height: 38px; text-align: left;
}
.timepick::-webkit-date-and-time-value { text-align: left; }
.timepick::-webkit-calendar-picker-indicator { filter: invert(0.75) sepia(1) hue-rotate(120deg); cursor: pointer; }
.timepick:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(39, 211, 195, 0.16); }
.timepick:disabled { opacity: 0.5; }

/* Header: the player's name opens the home screen */
.whobtn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 0; margin: 0; background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.whobtn .who .h1 { display: block; margin: 0; font-weight: 700; font-size: 23px; letter-spacing: 1px; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.whobtn .who { flex: 0 1 auto; }
.whobtn .swap { width: 16px; height: 16px; flex: none; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: square; margin: 14px 0 0 -4px; transition: stroke 0.15s ease; }
.whobtn:hover .swap { stroke: var(--fg); }
.whobtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

/* Home: players saved on this device, and adding one */
html.homeopen, html.homeopen body { overflow: hidden; }
.home { position: fixed; inset: 0; z-index: 100; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; animation: homein 0.24s ease-out both; }
.home.leaving { opacity: 0; transition: opacity 0.16s ease-in; }
@keyframes homein { from { opacity: 0; } }
.home-sky { position: fixed; inset: 0; pointer-events: none;
  background:
    radial-gradient(1.2px 1.2px at 8% 14%, rgba(232, 235, 240, 0.7), transparent 70%),
    radial-gradient(1px 1px at 23% 31%, rgba(232, 235, 240, 0.45), transparent 70%),
    radial-gradient(1.4px 1.4px at 41% 9%, rgba(232, 235, 240, 0.6), transparent 70%),
    radial-gradient(1px 1px at 63% 22%, rgba(39, 211, 195, 0.7), transparent 70%),
    radial-gradient(1.2px 1.2px at 82% 12%, rgba(232, 235, 240, 0.55), transparent 70%),
    radial-gradient(1px 1px at 92% 36%, rgba(232, 235, 240, 0.4), transparent 70%),
    radial-gradient(1px 1px at 15% 58%, rgba(232, 235, 240, 0.3), transparent 70%),
    radial-gradient(1.2px 1.2px at 74% 52%, rgba(232, 235, 240, 0.35), transparent 70%),
    radial-gradient(1px 1px at 52% 71%, rgba(39, 211, 195, 0.45), transparent 70%),
    radial-gradient(1px 1px at 88% 84%, rgba(232, 235, 240, 0.3), transparent 70%),
    radial-gradient(1px 1px at 33% 88%, rgba(232, 235, 240, 0.25), transparent 70%),
    radial-gradient(640px 360px at 50% -120px, rgba(39, 211, 195, 0.16), transparent 72%),
    radial-gradient(420px 260px at 100% 0, rgba(255, 122, 26, 0.07), transparent 70%);
}
.home-in { position: relative; max-width: 520px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top, 0px) + 26px) max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 32px) max(20px, env(safe-area-inset-left, 0px)); }
.home-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.emblem { position: relative; width: 78px; height: 78px; flex: none; }
.emblem img { position: absolute; left: 13px; top: 13px; width: 52px; height: 52px; border-radius: 13px; box-shadow: 0 0 0 1px rgba(39, 211, 195, 0.35), 0 12px 40px rgba(39, 211, 195, 0.28); }
.emblem svg { position: absolute; inset: 0; width: 78px; height: 78px; overflow: visible; animation: orbit 28s linear infinite; }
.emblem .ring { fill: none; stroke: rgba(39, 211, 195, 0.45); stroke-width: 1; stroke-dasharray: 1.5 5.5; }
.emblem .moon { fill: var(--teal); filter: drop-shadow(0 0 4px rgba(39, 211, 195, 0.9)); }
@keyframes orbit { to { transform: rotate(360deg); } }
.home-x { width: 42px; height: 42px; display: grid; place-items: center; border: 1px solid var(--line); background: rgba(20, 23, 28, 0.75); padding: 0; cursor: pointer; }
.home-x svg { width: 14px; height: 14px; stroke: var(--fg-2); stroke-width: 1.8; }
.home-h { font-size: 31px; line-height: 1.08; font-weight: 700; letter-spacing: 0.3px; margin: 22px 0 8px; outline: none; }
.home-lede { color: var(--fg-2); font-size: 15.5px; line-height: 1.5; margin: 0; max-width: 36ch; }
.home-note { margin: 16px 0 0; padding: 10px 12px; border: 1px solid rgba(255, 122, 26, 0.45); background: var(--accent-soft); color: var(--fg); font-size: 14px; }
.home-sec { margin-top: 30px; }
.home-sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.home-sec-h h2 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.prow { display: flex; align-items: stretch; gap: 8px; margin-bottom: 8px; }
.pbtn { flex: 1; min-width: 0; display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; align-items: center; column-gap: 12px; padding: 12px 14px;
  background: var(--surface); border: 1px solid var(--line); color: inherit; font: inherit; text-align: left; cursor: pointer;
  clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%); }
.pbtn:active { background: var(--raise); }
.pbtn:disabled { cursor: default; opacity: 0.75; }
.pbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.prow.cur .pbtn { border-color: rgba(39, 211, 195, 0.5); box-shadow: inset 3px 0 0 var(--teal); }
.pbtn .mono.av { width: 48px; height: 48px; }
.pmain { min-width: 0; display: grid; gap: 2px; }
.pname { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 8px; min-width: 0; font-size: 17px; }
.pname b { min-width: 0; max-width: 100%; padding-right: 1px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcur { flex: none; font-size: 10px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: var(--teal); border: 1px solid rgba(39, 211, 195, 0.45); padding: 1px 6px; }
.psub { font-family: var(--font-num); font-size: 12px; color: var(--muted); }
.pclub { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--fg-2); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pclub .badge { width: 16px; height: 16px; object-fit: contain; flex: none; }
.ptro { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-num); font-weight: 700; font-size: 15px; }
.tro { width: 14px; height: 14px; fill: var(--accent); flex: none; }
.premove { flex: none; border: 1px solid rgba(255, 107, 107, 0.45); background: var(--bad-soft); color: var(--bad); font: inherit; font-weight: 600; font-size: 13px; padding: 0 14px; cursor: pointer; }
.addcard { background: var(--surface); border: 1px solid var(--line); padding: 18px 16px 16px; }
.tagfield { display: flex; align-items: center; gap: 4px; border-bottom: 2px solid var(--line); padding: 2px 0 8px; transition: border-color 0.2s ease; cursor: text; }
.tagfield:focus-within { border-color: var(--accent); }
.tagfield.found { border-color: var(--teal); }
.tagfield.bad { border-color: var(--bad); }
.tagfield .hash { font-family: var(--font-num); font-weight: 700; font-size: 30px; line-height: 1; color: var(--accent); }
.tagfield input { flex: 1; min-width: 0; width: 100%; background: none; border: 0; outline: none; padding: 0; color: var(--fg); font-family: var(--font-num); font-weight: 700; font-size: 30px; line-height: 1.15; letter-spacing: 3px; text-transform: uppercase; }
.tagfield input::placeholder { color: #353c47; }
.tagfield.sm { margin-top: 10px; }
.tagfield.sm .hash, .tagfield.sm input { font-size: 20px; letter-spacing: 2px; }
.hint { color: var(--muted); font-size: 13px; line-height: 1.45; margin-top: 8px; }
.pv-wait { display: flex; align-items: center; gap: 10px; margin-top: 16px; color: var(--fg-2); font-size: 14px; }
.pv-wait i { width: 14px; height: 14px; flex: none; border: 2px solid var(--line); border-top-color: var(--teal); border-radius: 50%; animation: spin 0.8s linear infinite; }
.pv-wait.big { align-items: flex-start; }
.pv-wait.big i { margin-top: 3px; }
@keyframes spin { to { transform: rotate(360deg); } }
.pv-bar { height: 3px; margin-top: 12px; background: var(--line-2); overflow: hidden; }
.pv-bar i { display: block; height: 100%; width: 35%; background: linear-gradient(90deg, transparent, var(--teal), transparent); animation: sweep 1.3s ease-in-out infinite; }
@keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
.pv-err { margin-top: 12px; color: var(--bad); font-size: 14px; line-height: 1.45; }
.pcard { margin-top: 18px; padding: 14px; border: 1px solid rgba(39, 211, 195, 0.35);
  background: linear-gradient(180deg, rgba(39, 211, 195, 0.09), rgba(39, 211, 195, 0) 55%), var(--raise); animation: deal 0.34s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
@keyframes deal { from { opacity: 0; transform: translateY(-8px); } }
.pc-top { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; column-gap: 12px; align-items: center; }
.pc-top .mono.av { width: 56px; height: 56px; }
.pc-id { min-width: 0; display: grid; gap: 2px; }
.pc-name { font-weight: 700; font-size: 21px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc-tag { font-family: var(--font-num); font-size: 12.5px; color: var(--muted); }
.pc-tro { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-num); font-weight: 700; font-size: 17px; }
.pc-tro .tro { width: 16px; height: 16px; }
.pc-note { margin-top: 14px; color: var(--fg-2); font-size: 14px; line-height: 1.45; }
.pc-sec { margin-top: 18px; }
.pc-lbl { display: block; margin-bottom: 8px; font-size: 13.5px; font-weight: 600; color: var(--fg); }
.clubopts { display: grid; gap: 6px; }
.clubopt { display: grid; grid-template-columns: 34px minmax(0, 1fr); column-gap: 10px; align-items: center; padding: 9px 10px; text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); color: inherit; font: inherit; }
.clubopt[aria-checked="true"] { border-color: var(--teal); box-shadow: inset 0 0 0 1px var(--teal); background: rgba(39, 211, 195, 0.06); }
.clubopt:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.clubopt b { display: block; font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clubopt small { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; }
.cicon { position: relative; width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--raise); }
.cicon .badge { position: absolute; inset: 3px; width: 26px; height: 26px; object-fit: contain; }
.cicon .cdot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); }
.cicon svg { width: 14px; height: 14px; fill: none; stroke: var(--fg-2); stroke-width: 1.8; }
.clubfound { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.clubfound .badge { width: 34px; height: 34px; object-fit: contain; }
.clubfound b { display: block; font-weight: 600; }
.clubfound small { color: var(--muted); font-size: 12px; font-family: var(--font-num); }
.code-in { font-family: var(--font-num); font-weight: 700; font-size: 18px; letter-spacing: 3px; text-transform: uppercase; }
.btn.wide { width: 100%; margin-top: 18px; padding: 14px; font-size: 14px; }
.feats { display: grid; gap: 14px; margin-top: 34px; }
.feat { display: grid; grid-template-columns: 40px minmax(0, 1fr); column-gap: 14px; align-items: center; }
.fi { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid rgba(39, 211, 195, 0.35); background: rgba(39, 211, 195, 0.06); }
.fi svg { width: 18px; height: 18px; fill: none; stroke: var(--teal); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.feat b { display: block; font-weight: 600; font-size: 15px; }
.feat small { display: block; color: var(--muted); font-size: 13px; line-height: 1.4; margin-top: 2px; }
.home-foot { margin: 36px 0 0; color: var(--muted); font-size: 12px; text-align: center; }
@media (prefers-reduced-motion: reduce) { .home, .pcard { animation: none; } .emblem svg, .pv-wait i, .pv-bar i { animation: none; } }

/* Welcome: hello, then the tour */
.intro { position: fixed; inset: 0; z-index: 300; display: grid; place-items: center; background: #050608; overflow: hidden; outline: none;
  transition: opacity 0.42s ease, transform 0.42s cubic-bezier(0.3, 0, 0.2, 1), filter 0.42s ease; }
.intro.leaving { opacity: 0; transform: scale(1.06); filter: blur(6px); }
.intro-sky { position: absolute; inset: -20%; pointer-events: none; filter: blur(40px); opacity: 0.9; }
.intro-sky .aur { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; opacity: 0; animation: aurIn 2.4s ease 0.3s forwards, drift 16s ease-in-out infinite alternate; }
.intro-sky .a1 { left: 0; top: 10%; background: radial-gradient(closest-side, rgba(255, 122, 26, 0.26), transparent); }
.intro-sky .a2 { right: -5%; top: 25%; background: radial-gradient(closest-side, rgba(39, 211, 195, 0.22), transparent); animation-delay: 0.6s, 0s; animation-duration: 2.4s, 19s; }
.intro-sky .a3 { left: 25%; bottom: -10%; background: radial-gradient(closest-side, rgba(255, 210, 122, 0.14), transparent); animation-delay: 1s, 0s; animation-duration: 2.4s, 23s; }
@keyframes aurIn { to { opacity: 1; } }
@keyframes drift { from { transform: translate3d(-4%, -3%, 0) scale(1); } to { transform: translate3d(5%, 4%, 0) scale(1.12); } }
.intro-in { position: relative; width: min(560px, 100%); padding: 0 max(28px, env(safe-area-inset-left, 0px)); display: grid; justify-items: center; text-align: center; }
.hello { width: min(84vw, 460px); height: auto; overflow: visible; filter: drop-shadow(0 0 18px rgba(255, 170, 90, 0.28));
  transition: transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1); transform-origin: 50% 60%; }
.intro.shown .hello { transform: translateY(-14px) scale(0.78); animation: glow 4s ease-in-out 0.6s infinite alternate; }
@keyframes glow { to { filter: drop-shadow(0 0 26px rgba(39, 211, 195, 0.32)); } }

.tour { position: fixed; inset: 0; z-index: 250; display: flex; align-items: flex-end; justify-content: center; }

  box-shadow: 0 -24px 60px rgba(0, 0, 0, 0.55), inset 0 2px 0 rgba(39, 211, 195, 0.55);
  padding: 10px 20px calc(18px + env(safe-area-inset-bottom, 0px)); touch-action: pan-y; animation: sheetUp 0.46s cubic-bezier(0.2, 0.9, 0.2, 1) both;

.tour-art { margin: 10px -4px 4px; height: 160px; display: grid; place-items: center;
  background: radial-gradient(120% 90% at 50% 100%, rgba(39, 211, 195, 0.08), transparent 70%), var(--raise); border: 1px solid var(--line-2); }

.tour-note { margin: 12px 0 0; padding: 9px 11px; border-left: 2px solid var(--accent); background: var(--accent-soft); color: var(--fg); font-size: 13.5px; line-height: 1.45; }

.tour-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: auto; padding-top: 20px; }
.dots { display: flex; gap: 6px; }

.hf-links { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
.aside.priv { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 11.5px; letter-spacing: 0.2px; text-transform: none; }

.lcode { display: flex; gap: 14px; justify-content: center; margin: 4px 0 14px; font-family: var(--font-num); font-weight: 700; font-size: 34px; letter-spacing: 6px; color: var(--fg); }

.about .tour-sheet { max-width: 560px; }
.ab-sec { margin-top: 18px; }

.about a { color: var(--accent); }
.note .link { font-size: inherit; padding: 0; }

/* tour pictures */
.art-chart .grid path { stroke: var(--line-2); stroke-width: 1; }
.art-chart .line { fill: none; stroke: var(--teal); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: drawLine 1.4s cubic-bezier(0.4, 0, 0.2, 1) 0.2s forwards; }
@keyframes drawLine { to { stroke-dashoffset: 0; } }
.art-chart .area { opacity: 0; animation: fadeTo 0.8s ease 1s forwards; }
@keyframes fadeTo { to { opacity: 1; } }
.art-chart .dot { fill: var(--teal); opacity: 0; animation: fadeTo 0.3s ease 1.5s forwards; }
.art-chart .ping { fill: none; stroke: var(--teal); stroke-width: 2; opacity: 0; transform-origin: 252px 38px; animation: pingRing 1.8s ease-out 1.6s infinite; }

@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.art-club .av { fill: var(--line); }
.art-club .nm { fill: #3a414d; }
.art-club .on { fill: var(--teal); animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 50% { opacity: 0.35; } }
.art-club .track { fill: var(--bg); stroke: var(--line-2); }
.art-club .blk { fill: #2bb8ab; transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
.art-club .blk.live { fill: #7ff5ea; filter: drop-shadow(0 0 4px rgba(39, 211, 195, 0.8)); }
@keyframes grow { to { transform: none; } }
.art-club .now { fill: var(--accent); }
.art-goal .ring-bg { fill: none; stroke: var(--line); stroke-width: 9; }
.art-goal .ring { fill: none; stroke: var(--accent); stroke-width: 9; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; animation: ringFill 1.3s cubic-bezier(0.3, 0, 0.2, 1) 0.2s forwards; }
@keyframes ringFill { to { stroke-dashoffset: 28; } }
.art-goal .pct { fill: var(--fg); font: 700 20px var(--font-num); text-anchor: middle; }
.art-goal .note { opacity: 0; animation: drop 0.55s cubic-bezier(0.2, 0.9, 0.25, 1.15) 1.2s forwards; }
@keyframes drop { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
.art-goal .note rect:first-child { fill: #232831; stroke: var(--line); }
.art-goal .nicon { fill: rgba(255, 122, 26, 0.16); stroke: rgba(255, 122, 26, 0.6); }
.art-goal .nemo { font-size: 13px; text-anchor: middle; }
.art-goal .nt { fill: var(--fg); font: 600 12px var(--font-ui); }
.art-goal .ns { fill: var(--muted); font: 500 11px var(--font-num); }
.art-goal .bell path { fill: none; stroke: var(--teal); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.art-goal .bell { animation: ring 1.2s ease 1.8s 2; transform-box: fill-box; transform-origin: 50% 0; }
@keyframes ring { 0%, 100% { transform: translate(196px, 104px) rotate(0); } 20% { transform: translate(196px, 104px) rotate(14deg); } 40% { transform: translate(196px, 104px) rotate(-12deg); } 60% { transform: translate(196px, 104px) rotate(8deg); } 80% { transform: translate(196px, 104px) rotate(-4deg); } }
.art-code .cap rect { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; }
.art-code .cap text { fill: var(--fg); font: 700 22px var(--font-num); text-anchor: middle; }
.art-code .cap { opacity: 0; animation: capIn 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.2) forwards; }
@keyframes capIn { from { opacity: 0; } to { opacity: 1; } }
.art-code .lock rect { fill: rgba(39, 211, 195, 0.12); stroke: var(--teal); stroke-width: 2; }
.art-code .lock circle { fill: var(--teal); }
.art-code .lock .shackle { fill: none; stroke: var(--teal); stroke-width: 2.4; stroke-linecap: round; animation: unlock 0.5s cubic-bezier(0.3, 1.4, 0.4, 1) 1.1s forwards; }
@keyframes unlock { to { transform: translate(8px, -6px) rotate(18deg); } }
.art-code .lock { filter: drop-shadow(0 0 0 rgba(39, 211, 195, 0)); animation: lockGlow 0.6s ease 1.2s forwards; }
@keyframes lockGlow { to { filter: drop-shadow(0 0 10px rgba(39, 211, 195, 0.7)); } }
@media (min-width: 700px) {
  .tour { align-items: center; }
  .tour-sheet { border-bottom: 1px solid var(--line); animation-name: sheetPop; }
  @keyframes sheetPop { from { opacity: 0; transform: translateY(18px) scale(0.98); } }
  .tour.leaving .tour-sheet { opacity: 0; transform: translateY(12px); transition: opacity 0.25s ease, transform 0.25s ease; }
  .tour-grab { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .intro-sky .aur { animation: none; opacity: 1; }
  .hello, .intro-txt > *, .intro-go { transition: none; }
  .intro.shown .hello { animation: none; }
  .tour-sheet, .tour-page, .tour-back { animation: none; }
  .tour-art svg * { animation: none !important; opacity: 1 !important; transform: none !important; stroke-dashoffset: 0 !important; }
  .art-goal .ring { stroke-dashoffset: 28 !important; }
}

/* Motion */
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes glow { 0% { text-shadow: 0 0 0 transparent; } 25% { text-shadow: 0 0 22px currentColor; } 100% { text-shadow: 0 0 0 transparent; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.enter-item { animation: rise 0.38s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
.bump { animation: glow 1.2s ease-out; }
svg .line.draw { animation: draw 0.9s cubic-bezier(0.3, 0.7, 0.2, 1) forwards; }
svg .area.draw { animation: areain 0.9s ease-out both; }
@keyframes areain { from { opacity: 0; } to { opacity: 0.08; } }
svg .ring.draw { animation: fadein 0.3s 0.75s ease-out both; }
button { transition: transform 0.12s ease, background-color 0.15s ease, color 0.15s ease; -webkit-tap-highlight-color: transparent; }
button:active { transform: scale(0.97); }
.lib > .li:active, .coll-h:active { transform: scale(0.99); }
.tabbar button, .seg button, .jump button, .rangebar button, .sync { -webkit-user-select: none; user-select: none; }
@media (prefers-reduced-motion: reduce) {
  .enter-item, .bump, svg .draw, .sk { animation: none !important; }
  svg .line.draw { stroke-dashoffset: 0 !important; }
  button:active, .lib > .li:active, .coll-h:active { transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  .sync.busy i { animation: none; }
}

/* My stats / Explore switch */
.modesw { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); background: rgba(20, 23, 28, 0.6); }
.modesw button {
  min-height: 40px; border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.modesw button + button { border-left: 1px solid var(--line); }
.modesw button svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: square; flex: none; }
.modesw button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.modesw button[data-xmode="explore"][aria-current="page"] { background: var(--teal-soft); color: var(--teal); }
.top .modesw { max-width: 520px; }

/* Explore: a full screen of its own, over My stats */
html.xpopen, html.xpopen body { overflow: hidden; }
.xp { position: fixed; inset: 0; z-index: 110; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; animation: homein 0.22s ease-out both; }
.xp-sky { position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(700px 380px at 85% -140px, rgba(39, 211, 195, 0.14), transparent 70%), radial-gradient(520px 300px at 0 -60px, rgba(255, 122, 26, 0.09), transparent 70%); }
.xp-in { position: relative; max-width: 560px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 32px) max(16px, env(safe-area-inset-left, 0px)); }
.xp-top { position: sticky; top: 0; z-index: 3; display: grid; gap: 10px; padding: 0 0 10px;
  margin: 0 -16px; padding-left: 16px; padding-right: 16px; padding-top: 2px;
  background: rgba(12, 14, 17, 0.92); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.xp-bar { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.xp-back { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border: 1px solid var(--line); background: var(--surface); padding: 0; }
.xp-back svg { width: 16px; height: 16px; fill: none; stroke: var(--fg); stroke-width: 2; stroke-linecap: square; }
.xp-crumb { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--teal); }
.xp-body { display: grid; gap: 12px; padding-top: 6px; }
.xp-h { margin: 8px 0 0; font-size: 40px; line-height: 1; font-weight: 700; letter-spacing: 0.5px; outline: none; }
/* The heading's split-flap board (Explore. / Discover. / Track.). Sized to its column: 9 tiles fill the width up to 52px letters. */
.xp-h { container-type: inline-size; }
.xsr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.xflip { display: flex; gap: 0.07em; font-size: min(52px, 11vw); font-size: min(52px, 12.9cqw); line-height: 1; font-weight: 700; letter-spacing: 0; cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
.ft { position: relative; flex: none; width: 0.78em; height: 1.2em; }
.fh { position: absolute; left: 0; right: 0; height: 50%; overflow: hidden; background: #1a1e25; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.fh.ft-t { top: 0; border-radius: 3px 3px 0 0; transform-origin: 50% 100%; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05); }
.fh.ft-b { bottom: 0; border-radius: 0 0 3px 3px; transform-origin: 50% 0; background: #161a20; }
.fh > span { display: block; height: 200%; line-height: 1.2em; text-align: center; color: var(--fg); }
.fh.ft-b > span { transform: translateY(-50%); }
.fh.flap { z-index: 2; will-change: transform; }
.ft::after { content: ""; position: absolute; left: 0; right: 0; top: calc(50% - 1px); height: 2px; background: #0b0d10; z-index: 3; pointer-events: none; }
.ft.blank .fh { background: #13161b; }
.ft.blank .fh.ft-b { background: #111418; }
.xflip .fd { font-style: normal; }
.xflip .fd.t { color: var(--teal); }
.xflip .fd.o { color: var(--accent); }
.xflip.paused .ft::after { background: #08090b; }
.xp-lede { margin: 6px 0 4px; color: var(--fg-2); font-size: 15px; line-height: 1.5; }
.xp-search { background: var(--surface); border: 1px solid var(--line); padding: 14px 16px 16px; display: grid; gap: 12px; }
.xp-search .row2 { display: flex; gap: 10px; align-items: flex-end; }
.xp-search .tagfield { flex: 1; }
.xp-search .tagfield .hash, .xp-search .tagfield input { font-size: 24px; letter-spacing: 2px; }
.xp-go { min-height: 44px; min-width: 64px; }
.xp-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.xtile { text-align: left; display: grid; gap: 6px; align-content: start; min-height: 108px; padding: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); position: relative; overflow: hidden; }
.xtile:active { background: var(--raise); }
.xtile .fi { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid rgba(255, 122, 26, 0.45); background: var(--accent-soft); }
.xtile .fi svg { width: 18px; height: 18px; fill: none; stroke: var(--accent); stroke-width: 1.7; stroke-linecap: square; stroke-linejoin: miter; }
.xtile.t .fi { border-color: rgba(39, 211, 195, 0.45); background: var(--teal-soft); }
.xtile.t .fi svg { stroke: var(--teal); }
.xtile b { font-size: 15px; letter-spacing: 0.4px; text-transform: uppercase; }
.xtile small { color: var(--muted); font-size: 12.5px; line-height: 1.35; }
.xchips { display: flex; flex-wrap: wrap; gap: 8px; }
.xchip { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px 0 4px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-size: 13.5px; font-weight: 600; max-width: 100%; }
.xchip .mono { width: 34px; height: 34px; font-size: 11px; }
.xchip span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.xchip small { color: var(--muted); font-family: var(--font-num); font-size: 11px; font-weight: 500; }
.xsec-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 6px 0 -2px; }
.xsec-h h2 { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: 2.2px; text-transform: uppercase; color: var(--muted); }
.xsoon { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border: 1px dashed var(--line); color: var(--fg-2); font-size: 13.5px; line-height: 1.45; }
.xsoon b { color: var(--fg); }
.xsoon svg { width: 22px; height: 22px; flex: none; fill: none; stroke: var(--teal); stroke-width: 1.5; }
.xhome, .xcols, .xhome > div, .xcols > div { display: grid; gap: 12px; min-width: 0; }
.seg.fill { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); width: 100%; }
.seg.fill button { padding: 9px 4px; letter-spacing: 0.6px; min-height: 40px; }
.xp-foot { margin: 22px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; display: grid; gap: 4px; }

/* Player */
.xhero { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; align-items: center; }
.xhero .mono.av { width: 64px; height: 64px; font-size: 18px; }

.xclub { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; padding: 0; border: 0; background: none; color: var(--fg-2); font-size: 13.5px; min-height: 32px; text-align: left; }
.xclub .badge { width: 18px; height: 18px; object-fit: contain; }

.xacts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.xact { min-height: 44px; border: 1px solid var(--line); background: var(--raise); color: var(--fg); font-size: 11.5px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 6px; }
.xact svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; flex: none; }
.xact[aria-pressed="true"] { color: var(--accent); border-color: rgba(255, 122, 26, 0.55); background: var(--accent-soft); }
.xact[aria-pressed="true"] svg { fill: var(--accent); }
.xact.go { border-color: rgba(39, 211, 195, 0.5); color: var(--teal); background: var(--teal-soft); }
.xfresh { margin-top: 12px; color: var(--muted); font-size: 12px; line-height: 1.45; display: flex; gap: 8px; align-items: flex-start; }
.xfresh span { min-width: 0; }
.xfresh i { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); flex: none; margin-top: 6px; }
.xfresh.stale i { background: var(--accent); }
.xsince { border-left: 2px solid var(--teal); }
.xsince ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.xsince li { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--fg-2); }
.xsince li b { font-family: var(--font-num); font-weight: 700; }
.xtrack { border: 1px solid rgba(39, 211, 195, 0.35); background: linear-gradient(180deg, rgba(39, 211, 195, 0.08), rgba(39, 211, 195, 0) 60%), var(--surface); }
.xtrack p { margin: 0 0 12px; color: var(--fg-2); font-size: 14px; line-height: 1.5; }
.xmsg { margin-top: 10px; font-size: 13.5px; line-height: 1.45; }
.xmsg.bad { color: var(--bad); }
.xstat3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; margin-bottom: 12px; border: 1px solid var(--line); }
.xstat3 > div { padding: 10px 12px; border-right: 1px solid var(--line); display: grid; gap: 2px; min-width: 0; }
.xstat3 > div:last-child { border-right: 0; }
.xstat3 .k { font-size: 10.5px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); }
.xstat3 .v { font-family: var(--font-num); font-weight: 700; font-size: 20px; }
.xstat3 .n { color: var(--muted); font-size: 11.5px; font-family: var(--font-num); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.xbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line-2); }
.xbar:first-child { border-top: 0; }
.xbar .nm { display: flex; align-items: center; gap: 10px; min-width: 0; font-weight: 600; font-size: 14px; }
.xbar .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.xbar .nm .mono { width: 30px; height: 30px; font-size: 10px; }
.xbar .end { font-family: var(--font-num); font-size: 12.5px; color: var(--fg-2); text-align: right; white-space: nowrap; }
.xbar .meter { grid-column: 1 / -1; margin-top: 0; }
.xmore { width: 100%; min-height: 44px; margin-top: 8px; border: 1px solid var(--line); background: none; color: var(--accent); font-size: 11.5px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
.xlog { display: grid; grid-template-columns: 50px 30px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line-2); }
.xlog:first-child { border-top: 0; }
.xlog .mono { width: 30px; height: 30px; font-size: 10px; }
.xlog .nm { font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.xlog .nm .star { color: var(--accent); margin-left: 4px; }
.xlog .ds { color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.xlog .tc { font-family: var(--font-num); font-weight: 700; font-size: 13px; text-align: right; }
.xskel { display: grid; gap: 12px; }
.xerr { padding: 18px 16px; border: 1px solid rgba(255, 107, 107, 0.4); background: var(--bad-soft); display: grid; gap: 12px; }
.xerr b { font-size: 16px; }
.xerr p { margin: 0; color: var(--fg-2); font-size: 14px; line-height: 1.5; }
.xerr .btn { justify-self: start; min-height: 44px; }

/* Head-to-head */
.xvs-form { display: grid; grid-template-columns: minmax(0, 1fr) 44px minmax(0, 1fr); gap: 10px; align-items: end; }
.xvs-form .tagfield .hash, .xvs-form .tagfield input { font-size: 19px; letter-spacing: 1.5px; }
.xvs-form label.k-label { display: block; margin-bottom: 4px; }
.xswap { width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--raise); padding: 0; }
.xswap svg { width: 18px; height: 18px; fill: none; stroke: var(--fg-2); stroke-width: 1.8; }
.xvs-head { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; text-align: center; }
.xvs-p { display: grid; justify-items: center; gap: 6px; min-width: 0; padding: 0; border: 0; background: none; color: inherit; }
.xvs-p .mono.av { width: 64px; height: 64px; font-size: 18px; }
.xvs-p.a .mono.av { border-color: rgba(255, 122, 26, 0.7); box-shadow: 0 0 24px rgba(255, 122, 26, 0.25); }
.xvs-p.b .mono.av { border-color: rgba(39, 211, 195, 0.7); box-shadow: 0 0 24px rgba(39, 211, 195, 0.22); }
.xvs-p b { font-size: 16px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.xvs-p small { font-family: var(--font-num); color: var(--muted); font-size: 11.5px; }
.xvs-p .t { font-family: var(--font-num); font-weight: 700; font-size: 17px; display: inline-flex; align-items: center; gap: 5px; }
.xvs-mark { font-weight: 700; font-size: 30px; letter-spacing: 1px; background: linear-gradient(135deg, var(--accent), var(--teal)); -webkit-background-clip: text; background-clip: text; color: transparent; animation: vsin 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
@keyframes vsin { from { opacity: 0; transform: scale(1.6); } }
.xcmp { display: grid; gap: 0; }
.xrow { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 4px 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line-2); }
.xrow:first-child { border-top: 0; }
.xrow .lab { grid-column: 2; text-align: center; font-size: 10.5px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); }
.xrow .va, .xrow .vb { font-family: var(--font-num); font-size: 15px; color: var(--fg-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.xrow .va { text-align: left; grid-column: 1; grid-row: 1; }
.xrow .vb { text-align: right; grid-column: 3; grid-row: 1; }
.xrow .lead { color: var(--fg); font-weight: 700; }
.xrow .va.lead::after { content: " ◂"; color: var(--accent); font-size: 11px; }
.xrow .vb.lead::before { content: "▸ "; color: var(--teal); font-size: 11px; }
.xrow .dual { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 3px; height: 5px; }
.xrow .dual i { display: block; height: 100%; background: var(--line-2); position: relative; }
.xrow .dual i b { position: absolute; top: 0; bottom: 0; }
.xrow .dual i:first-child b { right: 0; background: var(--accent); }
.xrow .dual i:last-child b { left: 0; background: var(--teal); }
.xrow .sub2 { grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: 11.5px; font-family: var(--font-num); }
.xnote { color: var(--muted); font-size: 12.5px; line-height: 1.5; margin-top: 10px; }
.xnote.warn { color: var(--fg-2); border-left: 2px solid var(--accent); padding-left: 10px; }

/* Club scout */
.xclubh { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; align-items: center; }
.xclubh .badgebox { width: 64px; height: 64px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--raise); position: relative; font-weight: 700; }
.xclubh .badgebox .art { position: absolute; inset: 6px; width: calc(100% - 12px); height: calc(100% - 12px); object-fit: contain; }
.xdesc { margin: 12px 0 0; color: var(--fg-2); font-size: 13.5px; line-height: 1.5; overflow-wrap: anywhere; }
.xhist { display: grid; gap: 6px; }
.xhist .hr { display: grid; grid-template-columns: 112px minmax(0, 1fr) 28px; gap: 10px; align-items: center; font-family: var(--font-num); font-size: 12px; color: var(--fg-2); }
.xhist .hr .meter { margin: 0; height: 10px; }
.xhist .hr span:last-child { text-align: right; color: var(--fg); }
.xmem { width: 100%; display: grid; grid-template-columns: 24px 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border: 0; border-top: 1px solid var(--line-2); background: none; color: inherit; text-align: left; min-height: 50px; }
.xmem:first-child { border-top: 0; }
.xmem .mono { width: 34px; height: 34px; font-size: 11px; }
.xmem .nm { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.xmem .end { font-family: var(--font-num); font-size: 13px; text-align: right; }
.xmem .end small { display: block; color: var(--muted); font-size: 11px; }

/* Home screen: a way into Explore without tracking anyone */
.xpromo { width: 100%; display: grid; grid-template-columns: 40px minmax(0, 1fr) 18px; gap: 12px; align-items: center; text-align: left; padding: 14px; border: 1px solid rgba(39, 211, 195, 0.35); background: linear-gradient(90deg, rgba(39, 211, 195, 0.1), rgba(39, 211, 195, 0) 70%), var(--surface); color: var(--fg); min-height: 64px; }
.xpromo .fi { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid rgba(39, 211, 195, 0.45); background: var(--teal-soft); }
.xpromo .fi svg { width: 20px; height: 20px; fill: none; stroke: var(--teal); stroke-width: 1.7; }
.xpromo b { display: block; font-size: 15px; }
.xpromo small { display: block; color: var(--fg-2); font-size: 13px; line-height: 1.4; margin-top: 2px; }
.xpromo > svg { width: 16px; height: 16px; fill: none; stroke: var(--teal); stroke-width: 2; }

@media (min-width: 768px) {
  .xp-in { max-width: 1080px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
  .xp-top { margin: 0 -24px; padding-left: 24px; padding-right: 24px; }
  .xp-top .modesw { max-width: 420px; }
  .xp-tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .xcols { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 16px; align-items: start; }
  .xcols > div { display: grid; gap: 12px; min-width: 0; }
  .xhome { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .xhome > div { display: grid; gap: 12px; min-width: 0; }
  .xp-h { font-size: 52px; }
}
@media (max-width: 360px) {
  .xp-h { font-size: 34px; }
  .xacts { grid-template-columns: 1fr 1fr; }
  .xacts .xact:last-child { grid-column: 1 / -1; }
  .xstat3 .v { font-size: 17px; }
  .xvs-form { grid-template-columns: minmax(0, 1fr) 44px minmax(0, 1fr); gap: 6px; }
  .xhist .hr { grid-template-columns: 96px minmax(0, 1fr) 24px; }
}
@media (prefers-reduced-motion: reduce) { .xp, .xvs-mark { animation: none; } }
/* Explore first: the stronger tracking nudge, and the line under "since you last looked" */
.xtrack.keen { border-color: rgba(255, 122, 26, 0.5); background: linear-gradient(180deg, rgba(255, 122, 26, 0.09), rgba(255, 122, 26, 0) 60%), var(--surface); }
.xgap { color: var(--fg-2); }
.xgap .link { font-size: inherit; padding: 0; min-height: 0; vertical-align: baseline; }


.art-explore .bar rect:first-child { fill: var(--bg); stroke: rgba(39, 211, 195, 0.55); }
.art-explore .bar circle, .art-explore .bar path { fill: none; stroke: var(--teal); stroke-width: 2; stroke-linecap: round; }
.art-explore .bar text { fill: var(--fg); font: 700 13px var(--font-num); letter-spacing: 0.5px; }
.art-explore .bar text { clip-path: inset(0 100% 0 0); animation: typeIn 0.8s steps(10, end) 0.15s forwards; }
@keyframes typeIn { to { clip-path: inset(0 0 0 0); } }
.art-explore .caret { fill: var(--accent); animation: blink 1s steps(1) infinite; }
.art-explore .res { opacity: 0; animation: rise 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
.art-explore .rw { fill: var(--surface); stroke: var(--line-2); }
.art-explore .av { fill: var(--line); }
.art-explore .nm { fill: #3a414d; }
.art-explore .val { fill: var(--teal); opacity: 0.8; }
@media (prefers-reduced-motion: reduce) { .art-explore .bar text { clip-path: none; animation: none; } .art-explore .res { opacity: 1; animation: none; } .art-explore .caret { animation: none; } }
/* Keep comparison labels and values readable on narrow phones. */
.xcompare-tabs .seg { display: grid; grid-auto-flow: row; grid-template-columns: repeat(4, minmax(0, 1fr)); width: 100%; overflow: visible; }
.xcompare-tabs .seg button { min-width: 0; white-space: normal; }
@media (max-width: 420px) {
  .xcompare-tabs .seg { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .xcompare-tabs .seg button { min-height: 44px; }
  .xcompare-tabs .seg button:nth-child(2n) { border-right: 0; }
  .xcompare-tabs .seg button:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
  .xvs-p b { white-space: normal; text-overflow: clip; overflow-wrap: anywhere; text-align: center; }
  .xvs-p small, .xvs-p .t { max-width: 100%; overflow-wrap: anywhere; }
  .xvs-p .t { flex-wrap: wrap; justify-content: center; }
  .xrow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
  .xrow .lab { grid-column: 1 / -1; grid-row: 1; overflow-wrap: anywhere; }
  .xrow .va { grid-column: 1; grid-row: 2; }
  .xrow .vb { grid-column: 2; grid-row: 2; }
  .xrow .va, .xrow .vb { white-space: normal; overflow: visible; overflow-wrap: anywhere; }
}
</style>
</head>
<body>

<div id="home" class="home" hidden></div>
<div id="explore" class="xp" hidden role="region" aria-label="Explore"></div>

<div class="wrap">
  <header class="top">
    <nav class="modesw" aria-label="My stats or Explore"><button data-xmode="me" aria-current="page"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5.5" r="2.6"/><path d="M2.8 14c.6-2.8 2.7-4.4 5.2-4.4s4.6 1.6 5.2 4.4"/></svg>My stats</button><button data-xmode="explore"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M10.6 5.4 9.2 9.2 5.4 10.6 6.8 6.8l3.8-1.4Z"/></svg>Explore</button></nav>
    <div class="top-row">
      <button class="whobtn" id="whoBtn" aria-label="Switch profile">
        <span class="mono av" id="hAvatar" hidden></span>
        <span class="who">
          <span class="k-label" id="hSub">Player</span>
          <span class="h1" id="hName" role="heading" aria-level="1"></span>
        </span>
        <svg class="swap" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
      </button>
      <button class="sync stale" id="refreshBtn" aria-label="Refresh stats now" title="Refresh stats now"><i></i><span id="syncTxt">Loading</span></button>
    </div>
    <div class="rangebar" id="rangeBar" role="group" aria-label="Time range for every stat on this tab" hidden></div>
  </header>
  <div id="banner"></div>
  <main id="main">
    <div class="skel" id="skel" role="status" aria-label="Loading your stats"><div class="sk a"></div><div class="sk b"></div><div class="sk c"></div><div class="sk d"></div></div>
    <section data-tab="me" hidden></section>
    <section data-tab="club" hidden></section>
    <section data-tab="activity" hidden></section>
    <section data-tab="brawlers" hidden></section>
    <section data-tab="goals" hidden></section>
  </main>
</div>

<div class="tabbar">
  <nav aria-label="Sections">
    <button data-go="me" aria-current="page">Me</button>
    <button data-go="club">Club</button>
    <button data-go="activity">Activity</button>
    <button data-go="brawlers">Brawlers</button>
    <button data-go="goals">Goals</button>
  </nav>
</div>

<script src="app.js" defer></script>
</body>
</html>
