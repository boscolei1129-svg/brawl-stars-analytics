<style>
/* Layout: esports HUD. One phone-width column of hard-edged panels, sticky status bar, text tab bar with an orange rail. */
:root {
  color-scheme: dark;
  --bg: #0c0e11;
  --surface: #14171c;
  --raise: #1b1f26;
  --line: #2a2f38;
  --line-2: #22272f;
  --fg: #e8ebf0;
  --fg-2: #b4bcc9;
  --muted: #8a93a3;
  --accent: #ff7a1a;
  --accent-soft: rgba(255, 122, 26, 0.14);
  --teal: #27d3c3;
  --teal-soft: rgba(39, 211, 195, 0.13);
  --bad: #ff6b6b;
  --bad-soft: rgba(255, 107, 107, 0.13);
  --font-ui: "Chakra Petch", "Avenir Next Condensed", "Segoe UI", system-ui, sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --tabbar-h: 58px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
html, body { background: var(--bg); color: var(--fg); }
body {
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 24px);
  min-height: 100%;
}
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.k-label { font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }

/* Status bar */
.top {
  position: sticky; top: 0; z-index: 5;
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
  padding-bottom: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(12, 14, 17, 0.94);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line-2);
  display: grid; gap: 10px;
}
.top-row { display: flex; align-items: center; gap: 12px; min-width: 0; }
.rangebar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); }
.rangebar button {
  border: 0; border-right: 1px solid var(--line); background: none; color: var(--muted);
  font-size: 11.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 9px 0; min-height: 38px;
}
.rangebar button:last-child { border-right: 0; }
.rangebar button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.jump { display: flex; gap: 6px; flex-wrap: wrap; }
.jump button {
  background: none; border: 1px solid var(--line); color: var(--fg-2); padding: 8px 10px; min-height: 36px;
  font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
}
[id^="sec-"] { scroll-margin-top: calc(var(--hdr-h, 120px) + 12px); }
.card.coll { padding: 0; }
.coll-h { width: 100%; display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: none; border: 0; color: var(--fg); text-align: left; }
.coll-t { flex: 1; min-width: 0; display: grid; gap: 3px; }
.coll-h .sum { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.coll-h .sign { font-family: var(--font-num); font-size: 20px; line-height: 1; color: var(--accent); flex: none; width: 20px; text-align: center; }
.coll-b { padding: 0 16px 12px; border-top: 1px solid var(--line-2); }
.tiles.glance .tile:nth-child(3n) { border-right: 0; }
.tiles.glance .tile:nth-child(-n+3) { border-bottom: 1px solid var(--line); }
.who { min-width: 0; flex: 1; display: grid; gap: 1px; }
.who h1 { margin: 0; font-weight: 700; font-size: 23px; letter-spacing: 1px; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sync {
  flex: none; display: inline-flex; align-items: center; gap: 7px; min-height: 40px;
  background: none; border: 1px solid var(--line); padding: 0 11px;
  font-family: var(--font-num); font-size: 11px; letter-spacing: 0.5px; color: var(--teal); text-transform: uppercase;
}
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); flex: none; }
.sync.busy { color: var(--accent); }
.sync.busy i { background: var(--accent); animation: blink 0.9s steps(2) infinite; }
.sync.stale { color: var(--muted); }
.sync.stale i { background: var(--muted); }
@keyframes blink { 50% { opacity: 0.2; } }

/* Banner */
.banner {
  margin-top: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-left: 2px solid var(--accent);
  font-size: 13.5px; color: var(--fg-2); display: flex; gap: 10px; align-items: flex-start;
}
.banner b { color: var(--fg); font-weight: 600; }
.banner .btn { margin-left: auto; flex: none; }

/* Panels */
main { display: grid; gap: 12px; padding-top: 14px; }
section[data-tab] { display: grid; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); padding: 14px 16px; min-width: 0; }
.card.cut { clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 0 100%); }
.card h2 {
  margin: 0 0 10px; font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--muted);
  display: flex; align-items: center; gap: 8px; min-width: 0;
}
.card h2 .sp { flex: 1; }
.card h2 .aside { letter-spacing: 0; font-family: var(--font-num); font-weight: 500; text-transform: none; }
.link {
  background: none; border: 0; padding: 6px 0; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent);
}
.hud-k { display: flex; justify-content: space-between; gap: 10px; }
.hero-num { font-family: var(--font-num); font-weight: 700; font-size: clamp(40px, 13vw, 54px); line-height: 1; letter-spacing: -1px; margin: 8px 0 8px; color: var(--accent); }
.hero-num.teal { color: var(--teal); }
.hud-sub { display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--font-num); font-size: 12px; color: var(--fg-2); text-transform: uppercase; }
.up-t { color: var(--teal); }
.down-t { color: var(--bad); }
.flat-t { color: var(--muted); }
.sub { color: var(--muted); font-size: 12.5px; }
.asof { display: flex; align-items: flex-start; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line-2); font-size: 12.5px; color: var(--fg-2); }
.asof i { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); flex: none; margin-top: 5px; }
.asof.lag i { background: var(--accent); }
.asof b { font-family: var(--font-num); font-weight: 500; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--fg); display: block; }
.asof.lag b { color: var(--accent); }
.mt { margin-top: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; font-family: var(--font-num); font-size: 11.5px; font-weight: 500;
  border: 1px solid var(--line); color: var(--fg-2); white-space: nowrap; text-transform: uppercase;
}
.chip.up { color: var(--teal); border-color: rgba(39, 211, 195, 0.4); background: var(--teal-soft); }
.chip.down { color: var(--bad); border-color: rgba(255, 107, 107, 0.4); background: var(--bad-soft); }
.chip.hot { color: var(--accent); border-color: rgba(255, 122, 26, 0.45); background: var(--accent-soft); }

/* Stat strip */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); }
.tiles.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tile { padding: 10px 12px; min-width: 0; border-right: 1px solid var(--line); display: grid; gap: 2px; align-content: start; }
.tile:last-child { border-right: 0; }
.tile .k { font-size: 10.5px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v { font-family: var(--font-num); font-weight: 700; font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v.up { color: var(--teal); }
.tile .v.down { color: var(--bad); }
.tile .n { font-family: var(--font-num); font-size: 10.5px; color: var(--fg-2); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Segmented control */
.seg { display: inline-flex; border: 1px solid var(--line); max-width: 100%; overflow-x: auto; }
.seg button {
  border: 0; border-right: 1px solid var(--line); background: none; color: var(--muted);
  font-size: 11.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 8px 11px; white-space: nowrap;
}
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.ctrls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 10px; }

/* Charts */
.chart { position: relative; min-height: 170px; touch-action: pan-y; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .grid { stroke: var(--line-2); stroke-width: 1; }
.chart .ax { fill: var(--muted); font-size: 10.5px; font-family: var(--font-num); }
.chart .xh { stroke: var(--fg-2); stroke-width: 1; opacity: 0.45; }
.chart .ring { stroke: var(--surface); stroke-width: 2; }
.chart-empty { display: grid; place-items: center; min-height: 140px; color: var(--muted); font-size: 13.5px; text-align: center; padding: 0 12px; }
.tip {
  position: absolute; top: 0; pointer-events: none; z-index: 2; background: var(--raise); border: 1px solid var(--line);
  padding: 6px 9px; font-family: var(--font-num); font-size: 11.5px; color: var(--fg-2); white-space: nowrap; transform: translateX(-50%);
}
.tip b { color: var(--fg); font-size: 13px; }

/* Lists */
.list { display: grid; }
.li { display: flex; align-items: center; gap: 12px; padding: 10px 0; min-width: 0; border-top: 1px solid var(--line-2); }
.list > .li:first-child, .list > .lib:first-child > .li { border-top: 0; }
.li .main { flex: 1; min-width: 0; }
.li .t1 { font-weight: 600; font-size: 15px; letter-spacing: 0.3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .t2 { color: var(--muted); font-size: 12px; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .end { text-align: right; flex: none; font-family: var(--font-num); }
.li .end .big { font-weight: 700; font-size: 14.5px; }
.rank { width: 24px; flex: none; color: var(--muted); font-family: var(--font-num); font-size: 12px; text-align: right; }
.mono {
  width: 38px; height: 38px; flex: none; display: grid; place-items: center; position: relative;
  border: 1px solid var(--line); background: var(--raise); font-weight: 700; font-size: 13px; letter-spacing: 0.5px;
}
.mono.p11 { border-color: rgba(255, 122, 26, 0.6); }
.pow { position: absolute; right: -6px; bottom: -6px; font-family: var(--font-num); font-size: 9px; font-weight: 700; padding: 0 3px; background: var(--bg); border: 1px solid var(--line); color: var(--fg-2); }
.mono.p11 .pow { color: var(--accent); border-color: rgba(255, 122, 26, 0.6); }
.res { width: 46px; flex: none; font-family: var(--font-num); font-weight: 700; font-size: 12.5px; }
.res.w { color: var(--teal); }
.res.l { color: var(--bad); }
.res.d { color: var(--muted); }
.res.first { color: var(--accent); }
.you { color: var(--accent); font-size: 10.5px; font-weight: 700; letter-spacing: 1px; margin-left: 6px; }
.role { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 1px 5px; margin-left: 6px; vertical-align: 1px; border: 1px solid var(--line); color: var(--fg-2); }
.role.president { color: var(--accent); border-color: rgba(255, 122, 26, 0.5); }
.role.vicePresident { color: var(--teal); border-color: rgba(39, 211, 195, 0.45); }
.lib > .li { width: 100%; background: none; color: inherit; font: inherit; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; padding-left: 0; padding-right: 0; }
.detail { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 2px 0 12px 50px; }
.detail div { font-size: 10.5px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
.detail b { display: block; color: var(--fg); font-family: var(--font-num); font-size: 14px; letter-spacing: 0; text-transform: none; }

/* Meters */
.meter { height: 4px; background: var(--line-2); margin-top: 7px; }
.meter i { display: block; height: 100%; background: var(--fg-2); }
.meter.hot i { background: var(--accent); }
.meter.teal i { background: var(--teal); }
.wl { display: flex; gap: 2px; height: 8px; margin: 12px 0 8px; }
.wl i { display: block; height: 100%; }
.wl .w { background: var(--teal); }
.wl .l { background: var(--bad); }
.wl .d { background: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-family: var(--font-num); font-size: 12px; color: var(--fg-2); text-transform: uppercase; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 8px; height: 8px; display: inline-block; }
.wr { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.wr .pct { font-family: var(--font-num); font-weight: 700; font-size: 44px; line-height: 1; }
.wr .rec { color: var(--fg-2); font-family: var(--font-num); font-size: 12.5px; text-transform: uppercase; }
.log { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line-2); }
.log:first-child { border-top: 0; }
.log .nm { font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log .ds { color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log .tc { font-family: var(--font-num); font-weight: 700; font-size: 13.5px; text-align: right; }

/* Forms */
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-size: 10.5px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
.input { width: 100%; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); background: #0f1216; color: var(--fg); font-size: 15px; border-radius: 0; }
.input:focus { border-color: var(--accent); outline: none; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.form .full { grid-column: 1 / -1; }
.btn {
  border: 1px solid var(--accent); padding: 10px 14px; font-weight: 700; font-size: 12.5px; letter-spacing: 1.5px; text-transform: uppercase;
  background: var(--accent); color: #140a02;
}
.btn.ghost { background: none; color: var(--fg); border-color: var(--line); }
.btn.danger { background: var(--bad-soft); color: var(--bad); border-color: rgba(255, 107, 107, 0.45); }
.btn:disabled { opacity: 0.5; cursor: default; }
.search { flex: 1; min-width: 150px; }
.goal { display: grid; gap: 8px; }
.goal .gt { display: flex; align-items: baseline; gap: 8px; justify-content: space-between; }
.goal .gt h3 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
.goal .facts { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--fg-2); font-family: var(--font-num); font-size: 12.5px; }
.goal .facts b { color: var(--fg); }
.quick { display: flex; flex-wrap: wrap; gap: 8px; }
.note { color: var(--muted); font-size: 12.5px; line-height: 1.5; padding: 0 2px; }
.skel { display: grid; gap: 12px; padding: 2px 0; }
.sk { border: 1px solid var(--line); background: linear-gradient(90deg, var(--surface) 0%, var(--raise) 50%, var(--surface) 100%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
.sk.a { height: 128px; } .sk.b { height: 46px; } .sk.c { height: 150px; } .sk.d { height: 230px; }

/* Tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: rgba(12, 14, 17, 0.96);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-top: 1px solid var(--line-2);
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar nav { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.sec-label { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 11px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: var(--accent); }
.sec-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.tabbar button {
  background: none; border: 0; border-top: 2px solid transparent; color: var(--muted);
  font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; padding: 15px 0 14px; min-height: var(--tabbar-h);
}
.tabbar button[aria-current="page"] { border-top-color: var(--accent); color: var(--accent); font-weight: 700; }

@media (max-width: 360px) {
  .tile { padding: 9px 9px; }
  .tile .v { font-size: 17px; }
  .detail { padding-left: 0; }
  .tabbar button { letter-spacing: 0.2px; font-size: 10px; }
}
/* Tablet and wider: two columns of panels (built by layoutColumns in the script). */
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.col { display: grid; gap: 12px; min-width: 0; }
.col.stick { position: sticky; top: calc(var(--hdr-h, 120px) + 14px); }
@media (min-width: 768px) {
  .wrap { max-width: 1180px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
  .top {
    margin-left: calc(-1 * max(24px, env(safe-area-inset-left, 0px)));
    margin-right: calc(-1 * max(24px, env(safe-area-inset-right, 0px)));
    padding-left: max(24px, env(safe-area-inset-left, 0px));
    padding-right: max(24px, env(safe-area-inset-right, 0px));
  }
  .rangebar { max-width: 520px; }
  .tabbar nav { max-width: 720px; }
}
/* Game art: pictures sit on top of the initials, which show if a picture can't load. */
.mono { overflow: visible; }
.mono .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.mono .pow { z-index: 1; }
.mono.sm { width: 34px; height: 34px; font-size: 11px; }
.mono.ico .art { object-fit: contain; padding: 4px; }
.mono.av { width: 42px; height: 42px; }
.log { grid-template-columns: 40px 34px minmax(0, 1fr) auto; }
.res { width: auto; }
.rankrow { display: flex; align-items: center; gap: 14px; }
.rankart { width: 58px; height: 58px; object-fit: contain; flex: none; }

/* Switch (notification settings) */
.toggle { flex: none; width: 46px; height: 28px; border-radius: 14px; border: 1px solid var(--line); background: var(--raise); position: relative; padding: 0; }
.toggle i { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--muted); transition: transform 0.18s ease, background-color 0.18s ease; }
.toggle[aria-checked="true"] { background: rgba(39, 211, 195, 0.18); border-color: rgba(39, 211, 195, 0.6); }
.toggle[aria-checked="true"] i { transform: translateX(18px); background: var(--teal); }

/* Activity */
.act-now .big-row { display: flex; align-items: baseline; gap: 10px; }
.act-now .of { font-family: var(--font-num); color: var(--muted); font-size: 14px; }
.pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--teal); display: inline-block; box-shadow: 0 0 0 0 rgba(39, 211, 195, 0.6); animation: ping 1.8s ease-out infinite; flex: none; }
.pulse.off { background: var(--muted); animation: none; box-shadow: none; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(39, 211, 195, 0.55); } 80%, 100% { box-shadow: 0 0 0 10px rgba(39, 211, 195, 0); } }
.who-on { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.who-on .p { display: inline-flex; align-items: center; gap: 8px; border: 1px solid rgba(39, 211, 195, 0.35); background: rgba(39, 211, 195, 0.07); padding: 4px 10px 4px 4px; font-size: 13px; font-weight: 600; }
.who-on .p .mono { width: 26px; height: 26px; font-size: 10px; }
.who-on .p .ago { font-family: var(--font-num); font-size: 11px; color: var(--teal); font-weight: 500; }
.axis { position: relative; height: 16px; margin: 4px 0 2px; font-family: var(--font-num); font-size: 10px; color: var(--muted); }
.axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.axis span:first-child { transform: none; } .axis span:last-child { transform: translateX(-100%); }
.arow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; grid-template-areas: "av nm tot" "tr tr tr"; align-items: center; column-gap: 10px; row-gap: 7px;
  width: 100%; padding: 11px 0; background: none; border: 0; border-top: 1px solid var(--line-2); color: inherit; font: inherit; text-align: left; }
.arow:first-child { border-top: 0; }
.arow > .mono { grid-area: av; }
.arow .nm { grid-area: nm; min-width: 0; font-weight: 600; font-size: 14.5px; display: flex; align-items: center; gap: 7px; overflow: hidden; white-space: nowrap; }
.arow .nm b { overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.arow .tot { grid-area: tot; font-family: var(--font-num); font-size: 12px; color: var(--fg-2); text-align: right; }
.arow .tot small { display: block; color: var(--muted); font-size: 10.5px; }
.track { grid-area: tr; position: relative; height: 14px; background-color: var(--raise); border: 1px solid var(--line-2);
  background-image: repeating-linear-gradient(90deg, transparent 0, transparent calc(12.5% - 1px), var(--line-2) calc(12.5% - 1px), var(--line-2) 12.5%); }
.track .blk { position: absolute; top: 2px; bottom: 2px; min-width: 3px; background: linear-gradient(180deg, #3fe6d6, #1fb3a5); border-radius: 1px; }
.track .blk.live { background: linear-gradient(180deg, #7ff5ea, #27d3c3); box-shadow: 0 0 10px rgba(39, 211, 195, 0.75); }
.track .now { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--accent); box-shadow: 0 0 6px rgba(255, 122, 26, 0.7); }
.track.grow .blk { transform-origin: left center; animation: growx 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
@keyframes growx { from { transform: scaleX(0); opacity: 0.2; } to { transform: none; opacity: 1; } }
.adetail { padding: 2px 0 14px 44px; display: grid; gap: 10px; }
.adetail .sess { display: grid; gap: 6px; }
.adetail .sess div { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
.adetail .sess span:last-child { font-family: var(--font-num); color: var(--fg-2); font-size: 12px; text-align: right; }
.strip { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 2px; }
.strip i, .heat i { display: block; aspect-ratio: 1 / 1; background: rgba(39, 211, 195, var(--a, 0)); border: 1px solid var(--line-2); }
.heat { display: grid; grid-template-columns: 30px repeat(24, minmax(0, 1fr)); gap: 2px; align-items: center; }
.heat b { font-family: var(--font-num); font-size: 10px; color: var(--muted); font-weight: 500; }
.heat i.peak { border-color: var(--teal); box-shadow: 0 0 8px rgba(39, 211, 195, 0.6); }
.heat-x { display: grid; grid-template-columns: 30px repeat(4, minmax(0, 1fr)); font-family: var(--font-num); font-size: 10px; color: var(--muted); margin-top: 4px; }
.legend-ramp { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
.legend-ramp i { width: 60px; height: 8px; background: linear-gradient(90deg, rgba(39, 211, 195, 0.05), rgba(39, 211, 195, 1)); border: 1px solid var(--line-2); }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); margin-bottom: 12px; }
.days button { border: 0; border-right: 1px solid var(--line); background: none; color: var(--muted); padding: 7px 0 6px; display: grid; justify-items: center; gap: 2px; }
.days button:last-child { border-right: 0; }
.days button span { font-size: 9.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
.days button b { font-family: var(--font-num); font-size: 15px; font-weight: 600; color: var(--fg-2); }
.days button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
.days button[aria-pressed="true"] b { color: var(--accent); }
.barrow { display: grid; grid-template-columns: 34px minmax(0, 1fr) 76px; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line-2); }
.barrow:first-child { border-top: 0; }
.barrow .bar { height: 6px; background: var(--raise); margin-top: 6px; }
.barrow .bar i { display: block; height: 100%; background: linear-gradient(90deg, #1fb3a5, #3fe6d6); }
.barrow .nm { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.barrow .end { font-family: var(--font-num); font-size: 12.5px; text-align: right; }
.barrow .end small { display: block; color: var(--muted); font-size: 10.5px; }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } .track.grow .blk { animation: none; } }

/* Notification settings */
.li.pref { align-items: flex-start; padding: 13px 0; }
.li.pref .toggle { margin-top: 1px; }
.li .t2.desc { white-space: normal; overflow: visible; line-height: 1.45; margin-top: 3px; font-size: 12.5px; }
.when { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.when .lbl { font-size: 10.5px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
.when .next { font-size: 12px; color: var(--muted); }
.timepick {
  -webkit-appearance: none; appearance: none; font-family: var(--font-num); font-size: 15px; font-weight: 700; color: var(--teal);
  background: rgba(39, 211, 195, 0.07); border: 1px solid rgba(39, 211, 195, 0.45); border-radius: 0; padding: 7px 10px; min-width: 116px; min-height: 38px; text-align: left;
}
.timepick::-webkit-date-and-time-value { text-align: left; }
.timepick::-webkit-calendar-picker-indicator { filter: invert(0.75) sepia(1) hue-rotate(120deg); cursor: pointer; }
.timepick:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(39, 211, 195, 0.16); }
.timepick:disabled { opacity: 0.5; }

/* Header: the player's name opens the home screen */
.whobtn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 0; margin: 0; background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.whobtn .who .h1 { display: block; margin: 0; font-weight: 700; font-size: 23px; letter-spacing: 1px; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.whobtn .who { flex: 0 1 auto; }
.whobtn .swap { width: 16px; height: 16px; flex: none; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: square; margin: 14px 0 0 -4px; transition: stroke 0.15s ease; }
.whobtn:hover .swap { stroke: var(--fg); }
.whobtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

/* Home: players saved on this phone, and adding one */
html.homeopen, html.homeopen body { overflow: hidden; }
.home { position: fixed; inset: 0; z-index: 100; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; animation: homein 0.24s ease-out both; }
.home.leaving { opacity: 0; transition: opacity 0.16s ease-in; }
@keyframes homein { from { opacity: 0; } }
.home-sky { position: fixed; inset: 0; pointer-events: none;
  background:
    radial-gradient(1.2px 1.2px at 8% 14%, rgba(232, 235, 240, 0.7), transparent 70%),
    radial-gradient(1px 1px at 23% 31%, rgba(232, 235, 240, 0.45), transparent 70%),
    radial-gradient(1.4px 1.4px at 41% 9%, rgba(232, 235, 240, 0.6), transparent 70%),
    radial-gradient(1px 1px at 63% 22%, rgba(39, 211, 195, 0.7), transparent 70%),
    radial-gradient(1.2px 1.2px at 82% 12%, rgba(232, 235, 240, 0.55), transparent 70%),
    radial-gradient(1px 1px at 92% 36%, rgba(232, 235, 240, 0.4), transparent 70%),
    radial-gradient(1px 1px at 15% 58%, rgba(232, 235, 240, 0.3), transparent 70%),
    radial-gradient(1.2px 1.2px at 74% 52%, rgba(232, 235, 240, 0.35), transparent 70%),
    radial-gradient(1px 1px at 52% 71%, rgba(39, 211, 195, 0.45), transparent 70%),
    radial-gradient(1px 1px at 88% 84%, rgba(232, 235, 240, 0.3), transparent 70%),
    radial-gradient(1px 1px at 33% 88%, rgba(232, 235, 240, 0.25), transparent 70%),
    radial-gradient(640px 360px at 50% -120px, rgba(39, 211, 195, 0.16), transparent 72%),
    radial-gradient(420px 260px at 100% 0, rgba(255, 122, 26, 0.07), transparent 70%);
}
.home-in { position: relative; max-width: 520px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top, 0px) + 26px) max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 32px) max(20px, env(safe-area-inset-left, 0px)); }
.home-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.emblem { position: relative; width: 78px; height: 78px; flex: none; }
.emblem img { position: absolute; left: 13px; top: 13px; width: 52px; height: 52px; border-radius: 13px; box-shadow: 0 0 0 1px rgba(39, 211, 195, 0.35), 0 12px 40px rgba(39, 211, 195, 0.28); }
.emblem svg { position: absolute; inset: 0; width: 78px; height: 78px; overflow: visible; animation: orbit 28s linear infinite; }
.emblem .ring { fill: none; stroke: rgba(39, 211, 195, 0.45); stroke-width: 1; stroke-dasharray: 1.5 5.5; }
.emblem .moon { fill: var(--teal); filter: drop-shadow(0 0 4px rgba(39, 211, 195, 0.9)); }
@keyframes orbit { to { transform: rotate(360deg); } }
.home-x { width: 42px; height: 42px; display: grid; place-items: center; border: 1px solid var(--line); background: rgba(20, 23, 28, 0.75); padding: 0; cursor: pointer; }
.home-x svg { width: 14px; height: 14px; stroke: var(--fg-2); stroke-width: 1.8; }
.home-h { font-size: 31px; line-height: 1.08; font-weight: 700; letter-spacing: 0.3px; margin: 22px 0 8px; outline: none; }
.home-lede { color: var(--fg-2); font-size: 15.5px; line-height: 1.5; margin: 0; max-width: 36ch; }
.home-note { margin: 16px 0 0; padding: 10px 12px; border: 1px solid rgba(255, 122, 26, 0.45); background: var(--accent-soft); color: var(--fg); font-size: 14px; }
.home-sec { margin-top: 30px; }
.home-sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.home-sec-h h2 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.prow { display: flex; align-items: stretch; gap: 8px; margin-bottom: 8px; }
.pbtn { flex: 1; min-width: 0; display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; align-items: center; column-gap: 12px; padding: 12px 14px;
  background: var(--surface); border: 1px solid var(--line); color: inherit; font: inherit; text-align: left; cursor: pointer;
  clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%); }
.pbtn:active { background: var(--raise); }
.pbtn:disabled { cursor: default; opacity: 0.75; }
.pbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.prow.cur .pbtn { border-color: rgba(39, 211, 195, 0.5); box-shadow: inset 3px 0 0 var(--teal); }
.pbtn .mono.av { width: 48px; height: 48px; }
.pmain { min-width: 0; display: grid; gap: 2px; }
.pname { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 8px; min-width: 0; font-size: 17px; }
.pname b { min-width: 0; max-width: 100%; padding-right: 1px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcur { flex: none; font-size: 10px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: var(--teal); border: 1px solid rgba(39, 211, 195, 0.45); padding: 1px 6px; }
.psub { font-family: var(--font-num); font-size: 12px; color: var(--muted); }
.pclub { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--fg-2); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pclub .badge { width: 16px; height: 16px; object-fit: contain; flex: none; }
.ptro { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-num); font-weight: 700; font-size: 15px; }
.tro { width: 14px; height: 14px; fill: var(--accent); flex: none; }
.premove { flex: none; border: 1px solid rgba(255, 107, 107, 0.45); background: var(--bad-soft); color: var(--bad); font: inherit; font-weight: 600; font-size: 13px; padding: 0 14px; cursor: pointer; }
.addcard { background: var(--surface); border: 1px solid var(--line); padding: 18px 16px 16px; }
.tagfield { display: flex; align-items: center; gap: 4px; border-bottom: 2px solid var(--line); padding: 2px 0 8px; transition: border-color 0.2s ease; cursor: text; }
.tagfield:focus-within { border-color: var(--accent); }
.tagfield.found { border-color: var(--teal); }
.tagfield.bad { border-color: var(--bad); }
.tagfield .hash { font-family: var(--font-num); font-weight: 700; font-size: 30px; line-height: 1; color: var(--accent); }
.tagfield input { flex: 1; min-width: 0; width: 100%; background: none; border: 0; outline: none; padding: 0; color: var(--fg); font-family: var(--font-num); font-weight: 700; font-size: 30px; line-height: 1.15; letter-spacing: 3px; text-transform: uppercase; }
.tagfield input::placeholder { color: #353c47; }
.tagfield.sm { margin-top: 10px; }
.tagfield.sm .hash, .tagfield.sm input { font-size: 20px; letter-spacing: 2px; }
.hint { color: var(--muted); font-size: 13px; line-height: 1.45; margin-top: 8px; }
.pv-wait { display: flex; align-items: center; gap: 10px; margin-top: 16px; color: var(--fg-2); font-size: 14px; }
.pv-wait i { width: 14px; height: 14px; flex: none; border: 2px solid var(--line); border-top-color: var(--teal); border-radius: 50%; animation: spin 0.8s linear infinite; }
.pv-wait.big { align-items: flex-start; }
.pv-wait.big i { margin-top: 3px; }
@keyframes spin { to { transform: rotate(360deg); } }
.pv-bar { height: 3px; margin-top: 12px; background: var(--line-2); overflow: hidden; }
.pv-bar i { display: block; height: 100%; width: 35%; background: linear-gradient(90deg, transparent, var(--teal), transparent); animation: sweep 1.3s ease-in-out infinite; }
@keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
.pv-err { margin-top: 12px; color: var(--bad); font-size: 14px; line-height: 1.45; }
.pcard { margin-top: 18px; padding: 14px; border: 1px solid rgba(39, 211, 195, 0.35);
  background: linear-gradient(180deg, rgba(39, 211, 195, 0.09), rgba(39, 211, 195, 0) 55%), var(--raise); animation: deal 0.34s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
@keyframes deal { from { opacity: 0; transform: translateY(-8px); } }
.pc-top { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; column-gap: 12px; align-items: center; }
.pc-top .mono.av { width: 56px; height: 56px; }
.pc-id { min-width: 0; display: grid; gap: 2px; }
.pc-name { font-weight: 700; font-size: 21px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc-tag { font-family: var(--font-num); font-size: 12.5px; color: var(--muted); }
.pc-tro { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-num); font-weight: 700; font-size: 17px; }
.pc-tro .tro { width: 16px; height: 16px; }
.pc-note { margin-top: 14px; color: var(--fg-2); font-size: 14px; line-height: 1.45; }
.pc-sec { margin-top: 18px; }
.pc-lbl { display: block; margin-bottom: 8px; font-size: 13.5px; font-weight: 600; color: var(--fg); }
.clubopts { display: grid; gap: 6px; }
.clubopt { display: grid; grid-template-columns: 34px minmax(0, 1fr); column-gap: 10px; align-items: center; padding: 9px 10px; text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); color: inherit; font: inherit; }
.clubopt[aria-checked="true"] { border-color: var(--teal); box-shadow: inset 0 0 0 1px var(--teal); background: rgba(39, 211, 195, 0.06); }
.clubopt:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.clubopt b { display: block; font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clubopt small { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; }
.cicon { position: relative; width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--raise); }
.cicon .badge { position: absolute; inset: 3px; width: 26px; height: 26px; object-fit: contain; }
.cicon .cdot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); }
.cicon svg { width: 14px; height: 14px; fill: none; stroke: var(--fg-2); stroke-width: 1.8; }
.clubfound { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.clubfound .badge { width: 34px; height: 34px; object-fit: contain; }
.clubfound b { display: block; font-weight: 600; }
.clubfound small { color: var(--muted); font-size: 12px; font-family: var(--font-num); }
.code-in { font-family: var(--font-num); font-weight: 700; font-size: 18px; letter-spacing: 3px; text-transform: uppercase; }
.btn.wide { width: 100%; margin-top: 18px; padding: 14px; font-size: 14px; }
.feats { display: grid; gap: 14px; margin-top: 34px; }
.feat { display: grid; grid-template-columns: 40px minmax(0, 1fr); column-gap: 14px; align-items: center; }
.fi { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid rgba(39, 211, 195, 0.35); background: rgba(39, 211, 195, 0.06); }
.fi svg { width: 18px; height: 18px; fill: none; stroke: var(--teal); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.feat b { display: block; font-weight: 600; font-size: 15px; }
.feat small { display: block; color: var(--muted); font-size: 13px; line-height: 1.4; margin-top: 2px; }
.home-foot { margin: 36px 0 0; color: var(--muted); font-size: 12px; text-align: center; }
@media (prefers-reduced-motion: reduce) { .home, .pcard { animation: none; } .emblem svg, .pv-wait i, .pv-bar i { animation: none; } }

/* Welcome: hello, then the tour */
.intro { position: fixed; inset: 0; z-index: 300; display: grid; place-items: center; background: #050608; overflow: hidden; outline: none;
  transition: opacity 0.42s ease, transform 0.42s cubic-bezier(0.3, 0, 0.2, 1), filter 0.42s ease; }
.intro.leaving { opacity: 0; transform: scale(1.06); filter: blur(6px); }
.intro-sky { position: absolute; inset: -20%; pointer-events: none; filter: blur(40px); opacity: 0.9; }
.intro-sky .aur { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; opacity: 0; animation: aurIn 2.4s ease 0.3s forwards, drift 16s ease-in-out infinite alternate; }
.intro-sky .a1 { left: 0; top: 10%; background: radial-gradient(closest-side, rgba(255, 122, 26, 0.26), transparent); }
.intro-sky .a2 { right: -5%; top: 25%; background: radial-gradient(closest-side, rgba(39, 211, 195, 0.22), transparent); animation-delay: 0.6s, 0s; animation-duration: 2.4s, 19s; }
.intro-sky .a3 { left: 25%; bottom: -10%; background: radial-gradient(closest-side, rgba(255, 210, 122, 0.14), transparent); animation-delay: 1s, 0s; animation-duration: 2.4s, 23s; }
@keyframes aurIn { to { opacity: 1; } }
@keyframes drift { from { transform: translate3d(-4%, -3%, 0) scale(1); } to { transform: translate3d(5%, 4%, 0) scale(1.12); } }
.intro-in { position: relative; width: min(560px, 100%); padding: 0 max(28px, env(safe-area-inset-left, 0px)); display: grid; justify-items: center; text-align: center; }
.hello { width: min(84vw, 460px); height: auto; overflow: visible; filter: drop-shadow(0 0 18px rgba(255, 170, 90, 0.28));
  transition: transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1); transform-origin: 50% 60%; }
.intro.shown .hello { transform: translateY(-14px) scale(0.78); animation: glow 4s ease-in-out 0.6s infinite alternate; }
@keyframes glow { to { filter: drop-shadow(0 0 26px rgba(39, 211, 195, 0.32)); } }
.intro-txt > *, .intro-go { opacity: 0; transform: translateY(14px); transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1); }
.intro.shown .intro-txt > * { opacity: 1; transform: none; }
.intro.shown .intro-k { transition-delay: 0.15s; }
.intro.shown .intro-h { transition-delay: 0.28s; }
.intro.shown .intro-sub { transition-delay: 0.42s; }

    return '<div class="log"><span class="res ' + resCls(b) + '">' + esc(resLabel(b)) + '</span><span class="mono sm">' + art(b.br ? ART.brawler(b.br) : ART.mode(b.m)) + esc(initials(nm)) + '</span><div style="min-width:0"><div class="nm">' + esc(nm) + '</div><div class="ds">' + esc(modeName(b.m) + " · " + (b.map || "") + " · " + ago(b.t)) + (b.rk ? " · Ranked" : "") + '</div></div><span class="tc ' + tcls(b.tc) + '">' + (b.tc == null ? "—" : sgn(b.tc)) + "</span></div>";
  };

  // ---------- tabs ----------
  function streakInfo(list) {
    let k = null, n = 0;
    for (const b of list) { const o = outcome(b); if (o === "d") break; if (k == null) k = o; if (o !== k) break; n++; }
    if (!n) return { v: "—", n: "no streak", c: "" };
    return { v: n + (k === "w" ? "W" : "L"), n: "in a row", c: k === "w" ? "up" : "down" };
  }
  function drawTrophyChart(el) {
    const rk = S.r.me, ms = RANGES[rk];
    if (S.chartMode === "battle") {
      const list = D.battles.filter((b) => inRange(b.t, rk) && D.battleTrophies.has(b.t)).slice().reverse();
      const pts = list.map((b, i) => [i, D.battleTrophies.get(b.t)]);
      const start = list.length ? pts[0][1] - (list[0].tc || 0) : 0;
      drawChart(el, pts, {
        index: true, color: "var(--teal)", label: "Trophies after each battle", empty: "No battles in this range yet.",
        xLabels: [list.length + (list.length === 1 ? " BATTLE" : " BATTLES") + " AGO", "LATEST"],
        tip: (pt, i) => { const b = list[i]; return "<b>" + fmt(pt[1]) + "</b> · " + esc(sgn(pt[1] - start)) + " in range<br>" + esc(resLabel(b) + " · " + (b.br ? brName(b.br) : modeName(b.m)) + " · " + (b.tc == null ? "—" : sgn(b.tc))) + "<br>" + esc(dtShort(b.t)); },
      });
      return;
    }
    let pts = D.pSeries.filter((pt) => inRange(pt[0], rk));
    if (rk !== "all") {
      const b0 = valueAt(D.pSeries, Date.now() - ms);
      if (b0) pts = [[Date.now() - ms, b0[1]]].concat(pts);
    }
    const first = pts.length ? pts[0][1] : 0;
    drawChart(el, pts, {
      color: "var(--accent)", label: "Trophies over time", empty: "Readings appear here as updates come in.",
      tip: (pt) => "<b>" + fmt(pt[1]) + "</b> · " + esc(sgn(pt[1] - first)) + " in range<br>" + esc(dtShort(pt[0])),
    });
  }
  function renderMe() {
    const P = D.P;
    if (!P) return emptyState("Your trophies will appear after the first update.");
    const p = P.p, rk = S.r.me, ms = RANGES[rk];
    const c24 = change(D.pSeries, DAY);
    const c7 = D.pSeries.length && Date.now() - D.pSeries[0][0] > DAY ? change(D.pSeries, 7 * DAY) : null;
    const cr = change(D.pSeries, ms);
    const rr = rk === "24h" ? null : perDay(D.pSeries, ms);
    const st = wlStats(D.battles.filter((b) => inRange(b.t, rk)));
    const sk = streakInfo(D.battles);
    const eloC = change(D.eloSeries, ms);
    const base = snapAt(D.ps, Date.now() - ms);
    const vg = (k) => (base && p[k] != null && base.p[k] != null ? p[k] - base.p[k] : null);
    const rows = clubRows(), mine = rows.findIndex((r) => r.tag === ME), myRole = mine >= 0 ? rows[mine].role : null;
    const tile = (k, v, n, c) => '<div class="tile"><div class="k">' + k + '</div><div class="v ' + (c || "") + '">' + v + '</div><div class="n">' + n + "</div></div>";
    const since = (t) => (Date.now() - t < DAY ? tShort(t) : dShort(t));
    const trophNote = !cr ? "no data" : cr.partial ? "since " + since(cr.from) : rr ? sgn(rr.rate, Math.abs(rr.rate) < 10 ? 1 : 0) + "/day" : "in " + RANGE_LABEL[rk];
    const inPts = D.pSeries.filter((pt) => inRange(pt[0], rk));
    const startV = rk === "all" ? (inPts[0] || [0, null])[1] : (valueAt(D.pSeries, Date.now() - ms) || inPts[0] || [0, null])[1];
    const endV = D.pSeries.length ? D.pSeries[D.pSeries.length - 1][1] : null;
    const jumps = [["sec-overview", "Overview"], ["sec-battles", "Battles"], ["sec-modes", "Modes"], ["sec-log", "Log"], ["sec-career", "Career"]];
    return (
      '<div class="card cut" id="sec-overview">' +
        '<div class="hud-k k-label"><span>Trophies</span><span>' + esc(((D.C && D.C.c.name) || p.club || "") + (myRole ? " · " + (roleShort[myRole] || myRole) : "")) + "</span></div>" +
        '<div class="hero-num" data-k="me" data-v="' + p.trophies + '">' + fmt(p.trophies) + "</div>" +
        '<div class="hud-sub"><span>Peak ' + fmt(p.highest) + "</span>" +
          (p.trophies >= p.highest ? '<span class="up-t">At peak</span>' : "<span>" + fmt(p.highest - p.trophies) + " off peak</span>") +
          (c24 ? '<span class="' + tcls(c24.delta) + '">Δ24H ' + sgn(c24.delta) + "</span>" : "") +
          (c7 ? '<span class="' + tcls(c7.delta) + '">' + (c7.partial ? "Since " + esc(dShort(c7.from)) : "Δ7D") + " " + sgn(c7.delta) + "</span>" : "") +
        "</div>" +
      "</div>" +
      '<div class="jump" role="navigation" aria-label="Jump to section">' + jumps.map(([id, l]) => '<button data-jump="' + id + '">' + l + "</button>").join("") + "</div>" +
      '<div class="tiles glance">' +
        tile("Trophies", cr ? sgn(cr.delta) : "—", esc(trophNote), cr ? cls(cr.delta) : "") +
        tile("Win rate", st.rate == null ? "—" : pct100(st.rate) + "%", st.w + "W " + st.l + "L" + (st.d ? " " + st.d + "D" : "")) +
        tile("Per battle", st.perBattle == null ? "—" : sgn(st.perBattle, 1), st.n + (st.n === 1 ? " battle" : " battles"), cls(st.perBattle)) +
        tile("Streak", sk.v, sk.n, sk.c) +
        tile("Elo", fmt(p.elo), esc(p.rankName || "Unranked")) +
        tile("Club", mine >= 0 ? "#" + (mine + 1) : "—", "of " + (rows.length || "—")) +
      "</div>" +
      '<div class="card" id="sec-trend"><h2>Trophy trace</h2>' +
        '<div class="ctrls">' + seg("chart", S.chartMode, [["time", "By time"], ["battle", "By battle"]]) +
          (startV != null && endV != null ? '<span class="hud-sub"><span>' + fmt(startV) + " → " + fmt(endV) + '</span><span class="' + tcls(endV - startV) + '">' + sgn(endV - startV) + "</span></span>" : "") +
        "</div>" +
        chartSlot("chMe", drawTrophyChart) +
        sinceNote(cr) +
      "</div>" +
      battlesSection() +
      '<div class="sec-label" id="sec-career">Career</div>' +
      '<div class="card"><h2>Ranked<span class="sp"></span>' + (eloC ? '<span class="aside ' + tcls(eloC.delta) + '">' + sgn(eloC.delta) + " Elo · " + RANGE_LABEL[rk] + "</span>" : "") + "</h2>" +
        '<div class="rankrow">' + (p.rank ? '<img class="rankart" src="' + esc(ART.rank(p.rank)) + '" alt="" loading="lazy" onerror="this.remove()">' : "") + '<div><div style="font-weight:700;font-size:22px;letter-spacing:1px;text-transform:uppercase">' + esc(p.rankName || "Unranked") + '</div><div class="sub num">' + fmt(p.elo) + " Elo</div></div></div>" +
        '<div class="tiles two mt"><div class="tile"><div class="k">Season best</div><div class="v">' + fmt(p.seasonBestElo) + '</div></div><div class="tile"><div class="k">All-time best</div><div class="v">' + fmt(p.bestElo) + '</div><div class="n">' + esc(p.bestRankName || "") + "</div></div></div>" +
      "</div>" +
      '<div class="card"><h2>Victories<span class="sp"></span><span class="aside">gained · ' + RANGE_LABEL[rk] + "</span></h2>" +
        '<div class="tiles">' +
          ["v3", "solo", "duo"].map((k, i) => '<div class="tile"><div class="k">' + ["3v3", "Solo", "Duo"][i] + '</div><div class="v">' + fmt(p[k]) + '</div><div class="n ' + (vg(k) > 0 ? "up-t" : "") + '">' + (vg(k) == null ? "—" : sgn(vg(k))) + "</div></div>").join("") +
        "</div>" +
        '<div class="hud-sub mt"><span>Level ' + fmt(p.exp) + "</span><span>Prestige " + fmt(p.prestige) + "</span><span>" + Object.keys(P.b || {}).length + " brawlers</span></div>" +
      "</div>" +
      '<p class="note">' + (D.pSeries.length ? "History starts " + esc(dShort(D.pSeries[0][0])) + ", when this player was added. " : "") +
        "Readings every 15 minutes; win rates cover the battles the app has seen. Stats come from the official Brawl Stars API and BrawlTime. Unofficial, not endorsed by Supercell. " +
        '<button class="link" data-about="open">About and privacy</button></p>'
    );
  }

  function wlStats(list) {
    let w = 0, l = 0, d = 0, net = 0, tcn = 0;
    for (const b of list) { const o = outcome(b); if (o === "w") w++; else if (o === "l") l++; else d++; if (b.tc != null) { net += b.tc; tcn++; } }
    return { w, l, d, n: list.length, rate: w + l ? w / (w + l) : null, net, perBattle: tcn ? net / tcn : null };
  }
  function wlBar(st) {
    if (!st.n) return "";
    const seg2 = (k, v) => (v ? '<i class="' + k + '" style="flex:' + v + '"></i>' : "");
    return '<div class="wl" role="img" aria-label="' + st.w + " wins, " + st.l + " losses, " + st.d + ' draws">' + seg2("w", st.w) + seg2("l", st.l) + seg2("d", st.d) + "</div>";
  }
  function streakText(list) {
    let k = null, n = 0;
    for (const b of list) { const o = outcome(b); if (o === "d") break; if (k == null) k = o; if (o !== k) break; n++; }
    if (!n) return "No streak";
    return n + (k === "w" ? " win" : " loss") + (n === 1 ? "" : k === "w" ? "s" : "es") + " in a row";
  }

  function battlesSection() {
    const rk = S.r.me;
    const all = D.battles.filter((b) => S.bType === "all" || (S.bType === "ranked" ? b.rk : !b.rk));
    const list = all.filter((b) => inRange(b.t, rk));
    const st = wlStats(list);
    const head = '<div class="sec-label" id="sec-battles">Battles</div>';
    const ctrl = '<div class="ctrls"><span class="k-label">Win rate · ' + RANGE_LABEL[rk] + "</span>" + seg("bType", S.bType, [["all", "All"], ["trophy", "Trophy"], ["ranked", "Ranked"]]) + "</div>";
    if (!list.length)
      return head + '<div class="card cut">' + ctrl + '<div class="chart-empty" style="min-height:90px">No ' + (S.bType === "all" ? "" : S.bType + " ") + "battles saved in this range yet.</div></div>";
    const group = (keyFn) => {
      const m = new Map();
      for (const b of list) { const k = keyFn(b); if (!m.has(k)) m.set(k, []); m.get(k).push(b); }
      return [...m.entries()].map(([k, v]) => ({ k, s: wlStats(v), mode: v[0].m })).sort((a, b) => b.s.n - a.s.n);
    };
    const statRow = (name, sub, s, lead) =>
      '<div class="li">' + (lead || "") + '<div class="main"><div class="t1">' + esc(name) + '</div><div class="t2">' + esc(sub) + '</div><div class="meter hot"><i style="width:' + (s.rate == null ? 0 : pct100(s.rate)) + '%"></i></div></div>' +
      '<div class="end"><div class="big">' + (s.rate == null ? "—" : pct100(s.rate) + "%") + '</div><div class="t2 ' + tcls(s.net) + '">' + sgn(s.net) + "</div></div></div>";
    const modes = group((b) => b.m || "unknown");
    const maps = group((b) => (b.map || "Unknown map") + "|" + (b.m || ""));
    const mapsShown = S.showAllMaps ? maps : maps.slice(0, 6);
    const mapIds = new Map(); for (const b of D.battles) if (b.ev && b.map && !mapIds.has(b.map)) mapIds.set(b.map, b.ev);
    const pct = (s) => (s.rate == null ? "—" : pct100(s.rate) + "%");
    const more = (n) => (n > 0 ? " · +" + n + " more" : "");
    const coll = (key, id, label, summary, body) => {
      const open = !!S.open[key];
      return '<div class="card coll"' + (id ? ' id="' + id + '"' : "") + '><button class="coll-h" data-toggle="' + key + '" aria-expanded="' + open + '">' +
        '<span class="coll-t"><span class="k-label">' + label + '</span><span class="sum">' + esc(summary) + "</span></span>" +
        '<span class="sign" aria-hidden="true">' + (open ? "−" : "+") + "</span></button>" +
        (open ? '<div class="coll-b">' + body + "</div>" : "") + "</div>";
    };
    const top = modes[0], topMap = maps[0], last = list[0];
    const when = (t) => (Date.now() - t < DAY ? tShort(t) : dtShort(t));
    return (
      head +
      '<div class="card cut">' + ctrl +
        '<div class="wr"><span class="pct">' + pct(st) + '</span><span class="rec">' + st.n + (st.n === 1 ? " battle" : " battles") + ' · net <span class="' + tcls(st.net) + '">' + sgn(st.net) + "</span> · " + (st.perBattle == null ? "—" : sgn(st.perBattle, 1)) + "/battle</span></div>" +
        wlBar(st) +
        '<div class="legend"><span><i style="background:var(--teal)"></i>' + st.w + " wins</span><span><i style=\"background:var(--bad)\"></i>" + st.l + " losses</span>" + (st.d ? '<span><i style="background:var(--muted)"></i>' + st.d + " draws</span>" : "") + "</div>" +
        '<div class="sub mt">' + esc(streakText(all)) + ". Solo Showdown counts a top-5 finish as a win, as BrawlTime does.</div>" +
      "</div>" +
      coll("modes", "sec-modes", "By mode", modeName(top.k) + " · " + pct(top.s) + " · " + top.s.n + " battles" + more(modes.length - 1),
        '<div class="list">' + modes.map((g) => statRow(modeName(g.k), g.s.w + "W · " + g.s.l + "L" + (g.s.d ? " · " + g.s.d + "D" : "") + " · " + g.s.n + " battles", g.s, '<span class="mono ico">' + art(ART.mode(g.k)) + esc(initials(modeName(g.k))) + "</span>")).join("") + "</div>") +
      coll("maps", "", "By map", topMap.k.split("|")[0] + " · " + pct(topMap.s) + " · " + topMap.s.n + " battles" + more(maps.length - 1),
        '<div class="list">' + mapsShown.map((g) => statRow(g.k.split("|")[0], modeName(g.mode) + " · " + g.s.w + "W · " + g.s.l + "L · " + g.s.n + " battles", g.s, '<span class="mono">' + art(ART.map(mapIds.get(g.k.split("|")[0])) || ART.mode(g.mode)) + esc(initials(g.k.split("|")[0])) + "</span>")).join("") + "</div>" +
        (maps.length > 6 ? '<button class="link mt" data-act="maps">' + (S.showAllMaps ? "Show fewer" : "Show all " + maps.length) + "</button>" : "")) +
      coll("log", "sec-log", "Match log · " + list.length + " saved", "Latest: " + resLabel(last) + " with " + (last.br ? brName(last.br) : modeName(last.m)) + " · " + (last.tc == null ? "—" : sgn(last.tc)) + " · " + when(last.t),
        '<div class="list">' + list.slice(0, S.showAllLog ? 200 : 10).map(logRow).join("") + "</div>" +
        (list.length > 10 ? '<button class="link mt" data-act="log">' + (S.showAllLog ? "Show fewer" : "Show " + (Math.min(list.length, 200) - 10) + " more") + "</button>" : ""))
    );
  }

  function renderBrawlers() {
    const P = D.P;
    if (!P || !P.b) return emptyState("Your brawlers will appear after the first update.");
    const keys = Object.keys(P.b);
    const base = snapAt(D.ps, Date.now() - RANGES[S.r.climb]);
    const partial = base && D.ps.length && base.ts > Date.now() - RANGES[S.r.climb] + HOUR;
    const gain = (k) => (base && base.b && base.b[k] ? P.b[k][0] - base.b[k][0] : null);
    const played = new Map();
    for (const b of D.battles) if (b.br && inRange(b.t, S.r.climb)) { if (!played.has(b.br)) played.set(b.br, []); played.get(b.br).push(b); }
    let rows = keys.map((k) => ({ k, name: title(P.b[k][3]), tr: P.b[k][0], hi: P.b[k][1], pow: P.b[k][2], g: gain(k), pl: played.get(k) || [] }));
    const q = S.brQuery.trim().toLowerCase();
    if (q) rows = rows.filter((r) => r.name.toLowerCase().includes(q));
    if (S.brSort === "trophies") rows.sort((a, b) => b.tr - a.tr);
    else if (S.brSort === "climb") rows.sort((a, b) => (b.g ?? -1e9) - (a.g ?? -1e9) || b.tr - a.tr);
    else rows.sort((a, b) => b.pl.length - a.pl.length || b.tr - a.tr);
    const all = keys.map((k) => P.b[k]);
    const climbers = keys.map((k) => ({ k, g: gain(k) })).filter((x) => x.g > 0).sort((a, b) => b.g - a.g).slice(0, 3);
    return (
      '<div class="tiles">' +
        '<div class="tile"><div class="k">Unlocked</div><div class="v">' + keys.length + "</div></div>" +
        '<div class="tile"><div class="k">Power 11</div><div class="v">' + all.filter((b) => b[2] >= 11).length + "</div></div>" +
        '<div class="tile"><div class="k">1,000+</div><div class="v">' + all.filter((b) => b[0] >= 1000).length + "</div></div>" +
      "</div>" +
      '<div class="card"><h2>Biggest climbers · ' + RANGE_LABEL[S.r.climb] + "</h2>" +
        (climbers.length
          ? '<div class="list">' + climbers.map((c) => '<div class="li"><div class="mono">' + art(ART.brawler(c.k)) + esc(initials(brName(c.k))) + '</div><div class="main"><div class="t1">' + esc(brName(c.k)) + '</div><div class="t2 num">' + fmt(P.b[c.k][0]) + ' trophies</div></div><div class="end"><span class="chip up">' + sgn(c.g) + "</span></div></div>").join("") + "</div>"
          : '<div class="sub">No brawler has gained trophies in this range yet' + (partial ? " (tracking started " + esc(dtShort(D.firstTs)) + ")" : "") + ".</div>") +
      "</div>" +
      '<div class="card">' +
        '<div class="ctrls"><div class="search"><input class="input" id="brSearch" type="search" placeholder="Search brawlers" aria-label="Search brawlers" value="' + esc(S.brQuery) + '"></div></div>' +
        '<div class="ctrls">' + seg("brSort", S.brSort, [["trophies", "Trophies"], ["climb", "Climbers"], ["played", "Played"]]) + rangeSeg("climb", ["24h", "7d", "30d"]) + "</div>" +
        '<div class="list" id="brList">' +
          rows.map((r, i) => {
            const open = S.openBrawler === r.k, st = wlStats(r.pl), b = P.b[r.k];
            return '<div class="lib"><button class="li" data-br="' + esc(r.k) + '" aria-expanded="' + open + '">' +
              '<span class="rank">' + (i + 1) + "</span>" +
              '<span class="mono' + (r.pow >= 11 ? " p11" : "") + '">' + art(ART.brawler(r.k)) + esc(initials(r.name)) + '<span class="pow">P' + r.pow + "</span></span>" +
              '<span class="main"><span class="t1" style="display:block">' + esc(r.name) + '</span><span class="t2" style="display:block">Best ' + fmt(r.hi) + (r.pl.length ? " · " + r.pl.length + " played" : "") + "</span></span>" +
              '<span class="end"><span class="big" style="display:block">' + fmt(r.tr) + '</span><span class="t2 ' + (r.g == null ? "flat-t" : tcls(r.g)) + '" style="display:block">' + (r.g == null ? "new" : sgn(r.g)) + "</span></span>" +
            "</button>" +
            (open
              ? '<div class="detail"><div>Battles<b>' + st.n + "</b></div><div>Win rate<b>" + (st.rate == null ? "—" : pct100(st.rate) + "%") + "</b></div><div>Net<b>" + sgn(st.net) + "</b></div>" +
                "<div>Best<b>" + fmt(b[1]) + "</b></div><div>Max streak<b>" + fmt(b[5]) + "</b></div><div>Prestige<b>" + fmt(b[4]) + "</b></div></div>"
              : "") +
            "</div>";
          }).join("") +
          (rows.length ? "" : '<div class="sub" style="padding:12px 0">No brawler matches “' + esc(S.brQuery) + "”.</div>") +
        "</div>" +
      "</div>"
    );
  }

  function renderClub() {
    const C = D.C;
    if (!C) return emptyState(S.profile && !S.profile.club ? "This player isn't in a club, so there's no club to show. If they join one, it appears here." : "Club stats will appear after the first update.");
    const c = Object.assign({ members: [] }, C.c);
    const c24 = change(D.cSeries, DAY), cr = change(D.cSeries, RANGES[S.r.club]);
    const base = snapAt(D.cs, Date.now() - RANGES[S.r.members]);
    const baseMap = new Map(((base && base.c.members) || []).map((m) => [m[0], m[3]]));
    const covered = base ? (Date.now() - base.ts) / DAY : 0;
    const rows = c.members.map((m) => ({ tag: m[0], name: m[1], role: m[2], tr: m[3], icon: m[4], g: baseMap.has(m[0]) ? m[3] - baseMap.get(m[0]) : null }));
    const byTrophies = rows.slice().sort((a, b) => b.tr - a.tr);
    const sorted = S.memSort === "gain" ? rows.slice().sort((a, b) => (b.g ?? -1e9) - (a.g ?? -1e9) || b.tr - a.tr) : byTrophies;
    const nowTags = new Set(rows.map((r) => r.tag));
    const joined = base ? rows.filter((r) => !baseMap.has(r.tag)) : [];
    const left = base ? (base.c.members || []).filter((m) => !nowTags.has(m[0])) : [];
    const canInactive = covered >= 6.5 && S.r.members !== "24h";
    const top = rows.filter((r) => r.g > 0).sort((a, b) => b.g - a.g)[0];
    const mine = byTrophies.findIndex((r) => r.tag === ME);
    const fr = clubFreshness();
    return (
      '<div class="card cut">' +

  // ---------- goals ----------
  function goalSeries(g) {
    if (g.kind === "player") return D.pSeries;
    if (g.kind === "club") return D.cSeries;
    if (g.kind === "elo") return D.eloSeries;
    if (g.kind === "brawler") return D.ps.filter((s) => s.b && s.b[g.brawler]).map((s) => [s.ts, s.b[g.brawler][0]]);
    return [];
  }
  function goalTitle(g) {
    if (g.kind === "player") return fmt(g.target) + " trophies";
    if (g.kind === "club") return "Club at " + fmt(g.target);
    if (g.kind === "elo") return fmt(g.target) + " Elo";
    return brName(g.brawler) + " at " + fmt(g.target);
  }
  function renderGoals() {
    const P = D.P, C = D.C;
    const brOpts = P && P.b ? Object.keys(P.b).map((k) => [k, title(P.b[k][3])]).sort((a, b) => a[1].localeCompare(b[1])) : [];
    const suggestions = [];
    if (P) suggestions.push({ kind: "player", target: Math.ceil((P.p.trophies + 1) / 2500) * 2500 });
    if (C) suggestions.push({ kind: "club", target: Math.ceil((C.c.trophies + 1) / 25000) * 25000 });

    const sugg = suggestions.filter((s) => !S.goals.some((g) => g.kind === s.kind && g.target === s.target));
    const locked = false; // goals belong to this phone
    const lock = locked
      ? '<div class="card"><h2>Unlock goal editing</h2><form id="codeForm" class="row" novalidate><input class="input" id="ownerCode" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Code" aria-label="Player code" style="flex:1;min-width:140px"><button class="btn" type="submit">Unlock</button></form>' +

    const form =

            brOpts.map(([k, n]) => '<option value="' + esc(k) + '">' + esc(n) + " · " + fmt(P.b[k][0]) + "</option>").join("") +
          "</select></div>" +
          '<div class="full row"><button class="btn" type="submit"' + (!locked && !S.goalBusy ? "" : " disabled") + '>Add goal</button><span class="sub" id="gMsg">' + (S.goalBusy ? "Saving…" : "") + '</span></div>' +
        "</form>" +
        (sugg.length && !locked ? '<div class="quick mt">' + sugg.map((s) => '<button class="btn ghost" data-quick="' + s.kind + ":" + s.target + '">+ ' + esc(goalTitle(s)) + "</button>").join("") + "</div>" : "") +

    const cards = S.goals.slice().sort((a, b) => (a.created || 0) - (b.created || 0)).map((g) => {
      const series = goalSeries(g), cur = series.length ? series[series.length - 1][1] : null;

      const meter = g.kind === "club" ? "teal" : g.kind === "elo" ? "" : "hot";
      const confirming = S.confirmDel === g.id;
      return '<div class="card goal"><div class="gt"><h3>' + esc(goalTitle(g)) + '</h3><span class="chip ' + (done ? "up" : "hot") + '">' + Math.floor(pct) + "%</span></div>" +

        '<div class="facts"><span>Now <b>' + fmt(cur) + "</b></span><span>" + (done ? "<b>Done</b>" : "<b>" + fmt(g.target - cur) + "</b> to go") + "</span>" + (r ? "<span><b>" + sgn(r.rate, Math.abs(r.rate) < 10 ? 1 : 0) + "</b>/day</span>" : "") + "</div>" +
        '<div class="row" style="justify-content:space-between"><span class="sub">' + esc(eta) + "</span>" +

        "</div></div>";
    });
    return lock + form + (cards.length ? cards.join("") : '<div class="card"><div class="chart-empty">No goals yet. Pick a target above and the app will track progress and estimate when you\'ll get there.</div></div>') + pushCard(locked) + linkCard();
  }

  function emptyState(msg) { return '<div class="card"><div class="chart-empty">' + esc(msg) + "</div></div>"; }

  // ---------- tablet layout ----------
  // On iPad-sized screens and wider, each tab's panels are split into two columns. Phones keep one column.
  const WIDE = () => !!(window.matchMedia && window.matchMedia("(min-width: 768px)").matches);
  function layoutColumns(sec, tab) {
    if (!WIDE()) return;
    const kids = [...sec.children];
    if (kids.length < 2) return;
    const right = new Set(), full = new Set();
    let sticky = true;
    if (tab === "me") {
      // Left: trophies, chart and career. Right: battles, modes, maps and the match log.
      sticky = false;
      let battles = false;
      for (const k of kids) {
        if (k.id === "sec-battles") battles = true;
        else if (k.id === "sec-career") battles = false;
        if (k.matches(".note")) full.add(k);
        else if (battles) right.add(k);
      }
    } else if (tab === "goals") {
      // Left: unlock and new-goal form. Right: the goals.
      const form = sec.querySelector("#goalForm"), formCard = form && form.closest("section > *");
      let after = false;
      for (const k of kids) { if (after) right.add(k); if (k === formCard) after = true; }
    } else if (tab === "activity") {
      // Left: who's online, club rhythm and most active. Right: the 24-hour timeline.
      for (const k of kids) if (k.id === "act-timeline") right.add(k);
    } else if (tab === "club") {
      // Summary and chart on the left; member board and roster changes on the right.
      const board = kids.findIndex((k) => k.querySelector('[data-seg="memSort"]'));
      kids.forEach((k, i) => { if (board >= 0 && i >= board) right.add(k); });
    } else {
      // Brawlers: summary beside the brawler list.
      right.add(kids[kids.length - 1]);
    }
    if (!right.size) return;
    const cols = document.createElement("div"), a = document.createElement("div"), b = document.createElement("div");
    cols.className = "cols"; a.className = "col"; b.className = "col";
    for (const k of kids) if (!full.has(k)) (right.has(k) ? b : a).appendChild(k);
    cols.append(a, b);
    sec.prepend(cols);
    // Keep the short summary column in view beside a long list, when it fits on screen.
    const hdr = $(".top").offsetHeight || 120;
    if (sticky && a.offsetHeight + hdr + 40 < window.innerHeight) a.classList.add("stick");
  }

  // ---------- motion ----------
  const REDUCED = () => !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  function enterItems(sec) {
    const cols = sec.querySelectorAll(":scope > .cols > .col");
    const groups = cols.length ? [...cols].map((c) => [...c.children]) : [[...sec.children]];
    for (const items of groups) items.forEach((el, i) => { el.classList.add("enter-item"); el.style.animationDelay = Math.min(i, 8) * 45 + "ms"; });
  }
  // Big numbers count up to their new value (with a short glow) when fresh data changes them.
  const counts = {}, running = {};
  function countUps(root) {
    for (const el of root.querySelectorAll("[data-k]")) {
      const k = el.dataset.k, v = +el.dataset.v, prev = counts[k];
      counts[k] = v;
      if (prev != null && prev !== v && !REDUCED()) running[k] = { from: prev, to: v, t0: performance.now() };
      if (running[k]) { el.classList.add("bump"); el.textContent = fmt(running[k].from); }
    }
    if (Object.keys(running).length && !countUps.raf) countUps.raf = requestAnimationFrame(stepCounts);
  }
  function stepCounts(now) {
    countUps.raf = 0;
    for (const [k, a] of Object.entries(running)) {
      const p = Math.min(1, (now - a.t0) / 900), val = Math.round(a.from + (a.to - a.from) * (1 - Math.pow(1 - p, 3)));
      for (const el of document.querySelectorAll('[data-k="' + k + '"]')) el.textContent = fmt(val);
      if (p >= 1) delete running[k];
    }
    if (Object.keys(running).length) countUps.raf = requestAnimationFrame(stepCounts);
  }

  // ---------- activity ----------
  // Brawl Stars doesn't share who is online, so activity comes from battle logs: a member counts as
  // online when they finished a battle in the last ONLINE_MS, and play sessions are runs of battles.
  const ONLINE_MS = 12 * 60e3;
  const dur = (v) => { const m = Math.round(v / 60e3); if (m < 1) return "<1m"; const h = Math.floor(m / 60); return h ? h + "h" + (m % 60 ? " " + (m % 60) + "m" : "") : m + "m"; };
  const dayStart = (back) => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - back); return d.getTime(); };
  const hourLabel = (h) => (h % 12 || 12) + (h < 12 ? " AM" : " PM");
  const WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  let ACT = null;
  function activity() {
    const now = Date.now();
    if (ACT && ACT.ver === S.ver && now - ACT.at < 30e3) return ACT;
    const info = new Map();
    for (const s of D.cs) for (const m of s.c.members || []) info.set(m[0], { tag: m[0], name: m[1], role: m[2], icon: m[4] });
    const cur = (D.C && D.C.c.members) || [];
    for (const m of cur) info.set(m[0], { tag: m[0], name: m[1], role: m[2], icon: m[4] });
    const by = new Map();
    for (const r of S.sessions) {
      const a = by.get(r.tag) || [];
      a.push({ s: msOf(r.started_at), e: msOf(r.ended_at), n: r.battles || 0, tc: r.tc || 0, modes: r.modes || {} });
      by.set(r.tag, a);
    }
    for (const a of by.values()) a.sort((x, y) => x.s - y.s);
    const members = cur.map((m) => info.get(m[0]));
    const lastEnd = (tag) => { const a = by.get(tag); return a && a.length ? a[a.length - 1].e : null; };
    const online = members.filter((m) => { const e = lastEnd(m.tag); return e != null && now - e <= ONLINE_MS; }).sort((a, b) => lastEnd(b.tag) - lastEnd(a.tag));
    // Tracking started when the server first read the battle logs (earlier sessions come from those logs' history).
    const first = S.sessions.length ? Math.min(...S.sessions.map((r) => msOf(r.updated_at) || now)) : null;
    // Club rhythm: average number of members playing in each weekday-hour over the last 14 days.
    const from = Math.max(first || now, dayStart(13));
    const slots = new Map(), denom = Array.from({ length: 7 }, () => new Array(24).fill(0));
    for (let t = new Date(from).setMinutes(0, 0, 0); t <= now; t += HOUR) { const d = new Date(t); denom[d.getDay()][d.getHours()]++; }
    for (const [tag, a] of by) for (const x of a) {
      if (x.e < from) continue;
      for (let t = new Date(Math.max(x.s, from)).setMinutes(0, 0, 0); t < x.e; t += HOUR) {
        const k = t; if (!slots.has(k)) slots.set(k, new Set()); slots.get(k).add(tag);
      }
    }
    const sum = Array.from({ length: 7 }, () => new Array(24).fill(0));
    for (const [t, set] of slots) { const d = new Date(t); sum[d.getDay()][d.getHours()] += set.size; }
    const avg = sum.map((row, wd) => row.map((v, h) => (denom[wd][h] ? v / denom[wd][h] : 0)));
    const byHour = new Array(24).fill(0).map((_, h) => { let s = 0, n = 0; for (let wd = 0; wd < 7; wd++) { s += sum[wd][h]; n += denom[wd][h]; } return n ? s / n : 0; });
    const peakH = byHour.reduce((b, v, h) => (v > byHour[b] ? h : b), 0);
    let peakCell = null; for (let wd = 0; wd < 7; wd++) for (let h = 0; h < 24; h++) if (!peakCell || avg[wd][h] > avg[peakCell[0]][peakCell[1]]) peakCell = [wd, h];
    const days = first ? Math.max(1, Math.ceil((now - from) / DAY)) : 0;
    ACT = { ver: S.ver, at: now, info, by, members, online, lastEnd, first, avg, byHour, peakH, peakCell, days, from };
    return ACT;
  }
  // Play time and battles between t0 and t1 (sessions clipped to the window).
  function playIn(a, t0, t1) {
    let ms = 0, n = 0, tc = 0, k = 0;
    for (const x of a || []) {
      const s = Math.max(x.s, t0), e = Math.min(x.e, t1);
      if (e > s || (x.e >= t0 && x.e <= t1)) { ms += Math.max(0, e - s); n += x.n; tc += x.tc; k++; }
    }
    return { ms, n, tc, k };
  }
  // How often (share of days) a member played in each hour, over the last 14 days.
  function usualHours(a, from, now) {
    const hits = new Array(24).fill(0), seen = new Set();
    for (const x of a || []) {
      if (x.e < from) continue;
      for (let t = new Date(Math.max(x.s, from)).setMinutes(0, 0, 0); t < x.e; t += HOUR) {
        const d = new Date(t), key = d.toDateString() + "|" + d.getHours();
        if (!seen.has(key)) { seen.add(key); hits[d.getHours()]++; }
      }
    }
    const nDays = Math.max(1, Math.round((now - from) / DAY));
    return hits.map((v) => Math.min(1, v / nDays));
  }
  const modeTop = (modes) => { const e = Object.entries(modes || {}).sort((a, b) => b[1] - a[1])[0]; return e ? modeName(e[0]) : ""; };
  function renderActivity() {
    if (!D.C) return emptyState(S.profile && !S.profile.club ? "This player isn't in a club, so there's no club activity to show." : "Club activity appears after the first update.");
    const A = activity(), now = Date.now();
    if (!S.sessions.length)
      return '<div class="card cut"><h2>Club activity</h2><div class="chart-empty" style="min-height:120px">Collecting activity. The server reads every member\'s battle log every 15 minutes, so the first sessions show up shortly.</div></div>';
    const today0 = dayStart(0);
    const playedToday = A.members.filter((m) => playIn(A.by.get(m.tag), today0, now).k > 0);
    const clubToday = A.members.reduce((t, m) => t + playIn(A.by.get(m.tag), today0, now).ms, 0);
    const avatar = (m, cls) => '<span class="mono ' + (cls || "sm") + '">' + art(ART.icon(m.icon)) + esc(initials(m.name)) + "</span>";
    // Now
    const nowCard =
      '<div class="card cut act-now" id="act-now">' +
        '<div class="hud-k k-label"><span>Recently active</span><span>' + esc(D.C.c.name || "Club") + "</span></div>" +
        '<div class="big-row"><span class="pulse' + (A.online.length ? "" : " off") + '"></span><span class="hero-num teal" data-k="online" data-v="' + A.online.length + '" style="margin:6px 0">' + A.online.length + '</span><span class="of">/ ' + A.members.length + " members</span></div>" +
        (A.online.length
          ? '<div class="who-on">' + A.online.map((m) => '<span class="p">' + avatar(m) + esc(m.name) + '<span class="ago">' + esc(agoShort(A.lastEnd(m.tag))) + "</span></span>").join("") + "</div>"
          : (() => { const lastM = A.members.filter((m) => A.lastEnd(m.tag)).sort((a, b) => A.lastEnd(b.tag) - A.lastEnd(a.tag))[0];
              return '<div class="sub">No one is in a battle right now.' + (lastM ? " Last active: " + esc(lastM.name) + ", " + esc(ago(A.lastEnd(lastM.tag))) + "." : "") + "</div>"; })()) +
        '<div class="sub mt">An estimate: Brawl Stars doesn\'t share who\'s online, so a member counts as recently active if one of their battles ended in the last 12 minutes. They may have stopped since, and someone who just started won\'t show until a battle ends. Battle logs are read every 4 to 15 minutes.</div>' +
      "</div>";
    const tiles =
      '<div class="tiles">' +
        '<div class="tile"><div class="k">Played</div><div class="v">' + playedToday.length + '</div><div class="n">of ' + A.members.length + " today</div></div>" +

      "</div>";
    // Timeline for the chosen day
